function toast(msg){const box=document.createElement('div');box.className='toast';box.textContent=msg;$('toastContainer').append(box);setTimeout(()=>box.remove(),3100)}
function speak(s){if(!('speechSynthesis' in window)){toast('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.83;u.pitch=1;window.speechSynthesis.speak(u)}
function page(name){ui.page=name;ui.game=null;ui.learn=null;ui.reviewOnly=false;render();window.scrollTo({top:0,behavior:'instant'})}
function render(){updateChrome();const titles={home:'Overview',learn:'Learn words',practice:'Practice games',review:'Daily review',library:'Word library',progress:'My progress',settings:'Settings'};$('breadcrumbCurrent').textContent=titles[ui.page]||'Overview';document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===ui.page));const content=$('mainContent');switch(ui.page){case'home':content.innerHTML=homeHTML();break;case'learn':content.innerHTML=learnHTML();break;case'practice':content.innerHTML=practiceHTML();break;case'review':content.innerHTML=reviewHTML();break;case'library':content.innerHTML=libraryHTML();break;case'progress':content.innerHTML=progressHTML();break;case'settings':content.innerHTML=settingsHTML();break;}}
function heading(title,sub,button=''){return `<div class="page-heading"><div><div class="eyebrow mb16">YOUR LEARNING SPACE</div><h1>${title}</h1><p class="subheading">${sub}</p></div>${button}</div>`}
function gameCards(modes=GAMES.slice(0,4)){return modes.map(g=>`<button class="game-card" data-action="start-game" data-mode="${g.mode}"><span class="game-emoji">${g.icon}</span><h3>${h(g.name)} <span style="color:#b9bbca;float:right">↗</span></h3><p>${h(g.desc)}</p></button>`).join('')}
function weekChart(){const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-6+i);const date=localDate(d);return {date,count:dayData(date).answered,label:d.toLocaleDateString('en-US',{weekday:'short'}),today:date===today()}});const max=Math.max(10,...days.map(x=>x.count));return `<div class="week-bars">${days.map(d=>`<div class="week-col ${d.today?'current':''}"><div class="week-bar-bg"><span style="height:${Math.min(100,d.count/max*100)}%"></span></div><small>${d.label}</small></div>`).join('')}</div>`}
function homeHTML(){const done=dayData().answered,goal=data.settings.goal;return `<div class="page-intro"><div class="eyebrow">WEDNESDAY OR ANY DAY, KEEP GROWING</div><h1 style="margin:9px 0 3px">Your learning dashboard <span style="color:#8b84e2">✳</span></h1><p class="subheading">Build your English vocabulary, one small win at a time.</p></div>
<section class="hero"><div class="hero-text"><div class="hero-kicker">✦ &nbsp; YOUR DAILY WORD BOOST</div><h1>Small words.<br><em>Big progress.</em></h1><p>Learn with pictures, listen to natural pronunciation, and remember more with fun practice games.</p><button class="btn btn-light btn-lg" data-page="learn">Start learning <span>→</span></button></div><div class="hero-art" aria-hidden="true"><div class="art-orbit"></div><div class="art-orbit second"></div><div class="art-card big">📚</div><div class="art-card mini">🍓</div><div class="art-pill">+1 new word ✦</div><div class="art-spark">✳</div></div></section>
<div class="stats-grid"><div class="stat-card"><div class="stat-icon purple">✦</div><div><strong>${learnedCount()}</strong><small>Words practiced</small></div></div><div class="stat-card"><div class="stat-icon orange">♨</div><div><strong>${streakCount()}</strong><small>Day streak</small></div></div><div class="stat-card"><div class="stat-icon green">✓</div><div><strong>${masteredCount()}</strong><small>Words mastered</small></div></div></div>
<div class="section-header"><div><h2>Choose your learning path</h2><p class="subheading">Pick what matters to you right now.</p></div><button class="text-link" data-page="learn">View lessons →</button></div><div class="path-grid">${CATEGORIES.map(c=>`<button class="path-card" data-action="start-learn" data-category="${c.id}"><div class="path-art ${c.tone}"><span class="path-emoji">${c.emoji[0]}</span><span class="path-emoji">${c.emoji[1]}</span></div><div class="path-info"><h3>${c.name}</h3><p>${c.subtitle}</p><div class="path-foot"><span>${allWords().filter(w=>w.category===c.id).length} words · ${c.level}</span><b>↗</b></div></div></button>`).join('')}</div>
<div class="section-header"><div><h2>Make learning fun</h2><p class="subheading">Switch up your routine with bite-sized games.</p></div><button class="text-link" data-page="practice">All games →</button></div><div class="game-grid">${gameCards()}</div>
<div class="section-header"><h2>Keep the momentum</h2></div><div class="row-grid"><div class="panel"><div class="panel-header"><h3>This week's activity</h3><span class="badge">LAST 7 DAYS</span></div>${weekChart()}<p class="footnote mt20">A bar appears each day you practice.</p></div><div class="panel"><div class="panel-header"><h3>Today's goal</h3><span class="badge badge-green">${done>=goal?'COMPLETED':'IN PROGRESS'}</span></div><div class="progress-big">${Math.min(done,goal)} <span style="font-size:15px;color:#a6a8ba">/ ${goal} answers</span></div><div class="track"><span style="width:${Math.min(100,done/goal*100)}%"></span></div><p class="progress-caption">${done>=goal?'Great work! You reached your daily goal.':`${Math.max(0,goal-done)} more answers to reach your goal.`}</p><button class="btn btn-ghost mt20" data-page="review">Review my words ↗</button></div></div>`}
function initLearn(category='everyday',review=false){const pool=review?dueWords():allWords().filter(w=>w.category===category);if(!pool.length){toast('ยังไม่มีคำศัพท์ถึงเวลาทบทวน ลองฝึกหมวดทั่วไปก่อน');ui.learn=null;return}ui.learn={category,review,ids:shuffled(pool).slice(0,10).map(w=>w.id),index:0,stage:0,feedback:null,hadError:false,done:false,completed:0};ui.page='learn';render();}
function currentLearnWord(){return ui.learn?getWord(ui.learn.ids[ui.learn.index]):null}
function lessonAside(){return `<div class="lesson-side"><div class="panel"><span class="section-kicker">HOW IT WORKS</span><h3 class="mt10">Learn in 3 steps</h3><div class="step-list">${[['👀','See & hear'],['⌨️','Type the word'],['✍️','Finish a sentence']].map((x,i)=>`<div class="step-item ${ui.learn.stage===i?'active':ui.learn.stage>i?'done':''}"><span class="step-index">${ui.learn.stage>i?'✓':i+1}</span>${x[1]}</div>`).join('')}</div></div><div class="panel"><span class="section-kicker">STUDY TIP</span><div class="aside-tips mt20"><span class="tips-emoji">🌱</span><p style="margin:0">Say the word aloud before typing. Active recall improves learning.</p></div></div></div>`}
function learnHTML(){const tabs=`<div class="pill-row mb24">${CATEGORIES.map(c=>`<button class="pill ${ui.learn?.category===c.id&&!ui.learn.review?'selected':''}" data-action="start-learn" data-category="${c.id}">${c.emoji[0]} ${c.name}</button>`).join('')}${data.custom.length?`<button class="pill ${ui.learn?.category==='personal'?'selected':''}" data-action="start-learn" data-category="personal">💡 My words</button>`:''}</div>`;
if(!ui.learn)return heading('Learn new words','Learn by seeing, hearing, spelling, and making sentences.')+tabs+`<div class="panel"><h2>How would you like to learn today?</h2><p class="subheading">Choose a category above to start a short lesson of up to 10 words.</p><button class="btn btn-primary mt10" data-action="start-learn" data-category="everyday">Start Everyday life →</button></div>`;
const l=ui.learn;if(l.done)return heading('Lesson complete!','Nice work — your answers are saved on this device.')+`<div class="game-play-card result-card"><div class="result-emoji">🎉</div><h2>You finished the lesson</h2><div class="score">${l.completed}/${l.ids.length}</div><p>You've practiced ${l.completed} words. Come back later and use Daily Review to reinforce them.</p><button class="btn btn-primary" data-action="start-learn" data-category="${l.category}">Practice again</button> <button class="btn btn-outline" data-page="home">Dashboard</button></div>`;
const w=currentLearnWord();if(!w)return `<div class="empty-state">This word could not be found.</div>`;const stage=l.stage;const sentence=h(w.example).replace(new RegExp(`\\b${w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i'),'<strong>________</strong>');
const content=stage===0?`<h2 class="word-main">${h(w.en)}</h2>${data.settings.thai?`<div class="word-thai">${h(w.th)}</div>`:''}<button class="pronounce" data-action="speak" data-word="${h(w.id)}" aria-label="Listen to the word">♫</button><div><div class="example">${h(w.example)}</div></div><div class="lesson-actions"><button class="btn btn-outline" data-action="speak-example" data-word="${h(w.id)}">♫ Hear sentence</button><button class="btn btn-primary" data-action="learn-continue">Got it! Next step →</button></div>`:
`<div class="eyebrow">${stage===1?'SPELL THE WORD':'COMPLETE THE SENTENCE'}</div>${stage===1?`<h2 class="word-main">What is this?</h2>${data.settings.thai?`<p class="word-thai">${h(w.th)}</p>`:''}`:`<h2 class="word-main" style="font-size:22px">Fill in the blank</h2><div class="example">${sentence}</div>`}<form id="lessonAnswerForm"><input class="answer-input" id="lessonAnswer" aria-label="Your answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer" ${l.feedback?'disabled':''} /><div class="answer-hint">${stage===1?`${w.en.length} letters · first letter ${h(w.en[0]).toUpperCase()}`:'Type the missing word'}</div>${l.feedback?`<div class="feedback ${l.feedback.ok?'ok':'wrong'}">${l.feedback.ok?'✓ Correct! Well done.':`✗ The correct answer is “${h(w.en)}”.`}</div>`:''}<div class="lesson-actions">${l.feedback?`<button type="button" class="btn btn-primary" data-action="learn-continue">Continue →</button>`:`<button type="submit" class="btn btn-primary">Check answer →</button><button type="button" class="btn btn-outline" data-action="speak" data-word="${h(w.id)}">♫ Listen</button>`}</div></form>`;
return heading('Learn new words','See it. Hear it. Type it. Use it in a sentence.')+tabs+`<div class="learning-layout"><div class="lesson-card"><div class="lesson-top"><span class="badge">WORD ${l.index+1} OF ${l.ids.length}</span><span class="question-number">Step ${stage+1}/3</span></div><div class="lesson-progress">${l.ids.map((_,i)=>`<span class="${i<l.index?'filled':i===l.index?'current':''}"></span>`).join('')}</div><div class="word-visual"><span class="floating-label">LEARN WITH PICTURES</span><span class="large-emoji" aria-label="Picture clue">${h(w.emoji)}</span></div><div class="lesson-center">${content}</div></div>${lessonAside()}</div>`}
function learnCheck(){const l=ui.learn;if(!l||l.feedback)return;const w=currentLearnWord();const el=$('lessonAnswer');if(!el||!el.value.trim()){toast('พิมพ์คำตอบก่อนตรวจ');return}const ok=el.value.trim().toLocaleLowerCase()===w.en.toLocaleLowerCase();l.feedback={ok};if(!ok)l.hadError=true;render();}
function learnContinue(){const l=ui.learn;if(!l)return;if(l.stage===0){l.stage=1;}else if(l.stage===1){if(!l.feedback)return;l.stage=2;l.feedback=null;}else{if(!l.feedback)return;recordAnswer(l.ids[l.index],!l.hadError&&l.feedback.ok);l.completed++;l.index++;if(l.index>=l.ids.length){l.done=true}else{l.stage=0;l.feedback=null;l.hadError=false}}render();if(l.stage>0&&!l.done&&!l.feedback){const input=$('lessonAnswer');if(input)input.focus();}}
function startGame(mode='picture',forceReview=false){let pool=forceReview?dueWords():mode==='mistakes'?mistakeWords():allWords();if(mode==='picture')pool=pool.filter(w=>w.category!=='notion');if(!pool.length){toast('ยังไม่มีคำศัพท์ในชุดนี้ เริ่มเรียนหรือทำแบบฝึกก่อน');return}if(mode==='mistakes')mode='type';const ids=shuffled(pool).slice(0,mode==='match'?6:10).map(w=>w.id);ui.game={mode,ids,index:0,score:0,wrong:0,answer:null,result:false,review:forceReview};if(mode==='match'){const shuffledIds=shuffled(ids);ui.game.match={left:null,right:null,matched:[],rightOrder:shuffledIds,errors:0}}ui.page='practice';render();}
function gameQuestionHTML(){const g=ui.game,w=getWord(g.ids[g.index]);if(!w)return '';const found=g.answer!==null;const gap=h(w.example).replace(new RegExp(`\\b${w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i'),'<strong style="color:#5b53d7">________</strong>');let main='';
if(g.mode==='picture'){const distractors=shuffled(allWords().filter(x=>x.id!==w.id)).slice(0,3);const choices=g.choices||(g.choices=shuffled([w,...distractors]).map(x=>x.id));main=`<div class="game-visual">${h(w.emoji)}</div><h2 class="game-title">Which word matches this picture?</h2>${data.settings.thai?`<p class="game-desc">${h(w.th)}</p>`:''}<div class="choice-grid">${choices.map(id=>{const x=getWord(id),isCorrect=id===w.id;const cls=found?(isCorrect?'selected-correct':g.answer===id?'selected-wrong':''):'';return `<button class="choice ${cls}" ${found?'disabled':''} data-action="answer-choice" data-choice="${h(id)}">${h(x.en)}</button>`}).join('')}</div>`}
else{main=g.mode==='type'?`<div class="game-visual">${h(w.emoji)}</div><h2 class="game-title">Spell this word</h2><p class="game-desc">${data.settings.thai?h(w.th):`${w.en.length} letters`}</p>`:g.mode==='sentence'?`<div class="game-visual" style="height:95px;font-size:44px">📝</div><h2 class="game-title">Complete the sentence</h2><div class="example" style="display:block;max-width:490px;text-align:center;margin:19px auto">${gap}</div>`:`<div class="game-visual" style="height:120px;font-size:48px">🎧</div><h2 class="game-title">Listen carefully and type</h2><p class="game-desc">Listen to the word, then type what you hear.</p><div class="center"><button class="btn btn-ghost" data-action="speak" data-word="${h(w.id)}">♫ Play audio</button></div>`;
main+=`<form id="gameAnswerForm" class="center"><input id="gameAnswer" class="answer-input" aria-label="Your English answer" placeholder="Your answer..." autocomplete="off" spellcheck="false" autocapitalize="off" ${found?'disabled':''}>${!found?`<div class="lesson-actions"><button type="submit" class="btn btn-primary">Check answer →</button></div>`:''}</form>`;}
if(found)main+=`<div class="feedback ${g.answer===w.id?'ok':'wrong'}">${g.answer===w.id?'✓ Correct! Great job.':`✗ Correct answer: “${h(w.en)}” — ${h(w.th)}`}</div><div class="lesson-actions"><button class="btn btn-primary" data-action="game-next">${g.index===g.ids.length-1?'See results':'Next question →'}</button></div>`;
return main;}
function matchHTML(){const m=ui.game.match;const len=ui.game.ids.length;const left=ui.game.ids.map(id=>getWord(id)),right=m.rightOrder.map(id=>getWord(id));return `<div class="game-header"><span class="badge">MATCH ${m.matched.length} / ${len}</span><span class="question-number">Tap one word and one translation</span></div><div class="lesson-progress">${ui.game.ids.map((_,i)=>`<span class="${i<m.matched.length?'filled':''}"></span>`).join('')}</div><h2 class="game-title">Match the pairs</h2><p class="game-desc">Choose an English word, then its Thai meaning.</p><div class="match-grid"><div class="match-col">${left.map(w=>`<button ${m.matched.includes(w.id)?'disabled':''} data-action="match-left" data-match="${h(w.id)}" class="match-tile ${m.left===w.id?'picked':''} ${m.matched.includes(w.id)?'matched':''}">${h(w.en)}</button>`).join('')}</div><div class="match-col">${right.map(w=>`<button ${m.matched.includes(w.id)?'disabled':''} data-action="match-right" data-match="${h(w.id)}" class="match-tile ${m.right===w.id?'picked':''} ${m.matched.includes(w.id)?'matched':''}">${h(w.th)}</button>`).join('')}</div></div>`}
function practiceHTML(){if(!ui.game)return heading('Practice games','Practice makes progress. Choose a game to begin.')+`<div class="notice mb24">💡 Every question helps build your learning history. Correct answers are scheduled for later review.</div><div class="games-selection">${gameCards(GAMES)}</div>`;
const g=ui.game;if(g.result){const total=g.ids.length;return heading('Session complete','Your results have been saved on this device.')+`<div class="game-play-card result-card"><div class="result-emoji">${g.score===total?'🏆':'🎉'}</div><h2>Nice effort!</h2><div class="score">${g.score}/${total}</div><p>${g.wrong===0?'Perfect round! Keep reviewing to make these words stick.':`You got ${g.score} correct and ${g.wrong} wrong. Missed words will be available in Mistake Words.`}</p><button class="btn btn-primary" data-action="start-game" data-mode="${g.mode}">Play again</button> <button class="btn btn-outline" data-page="practice">Other games</button></div>`}
return `<div class="game-section"><button class="text-link mode-back" data-action="exit-game">← All games</button><div class="game-play-card">${g.mode==='match'?matchHTML():`<div class="game-header"><span class="badge">QUESTION ${g.index+1} / ${g.ids.length}</span><span class="question-number">SCORE ${g.score}</span></div><div class="lesson-progress">${g.ids.map((_,i)=>`<span class="${i<g.index?'filled':i===g.index?'current':''}"></span>`).join('')}</div>${gameQuestionHTML()}`}</div></div>`}
function answerGame(value){const g=ui.game;if(!g||g.answer!==null||g.mode==='match')return;const w=getWord(g.ids[g.index]);if(!w)return;const ok=g.mode==='picture'?value===w.id:String(value).trim().toLocaleLowerCase()===w.en.toLocaleLowerCase();g.answer=ok?w.id:'wrong';if(ok)g.score++;else g.wrong++;recordAnswer(w.id,ok);render();}
function nextGame(){const g=ui.game;if(!g||g.answer===null)return;g.index++;g.answer=null;g.choices=null;if(g.index>=g.ids.length){g.result=true}render();if(!g.result&&g.mode!=='picture'){const el=$('gameAnswer');if(el)el.focus()}}
function matchClick(side,id){const g=ui.game,m=g?.match;if(!m||m.matched.includes(id))return;m[side]=id;if(m.left&&m.right){const correct=m.left===m.right;if(correct){m.matched.push(id);g.score++;recordAnswer(id,true)}else{m.errors++;g.wrong++;recordAnswer(m.left,false)}m.left=null;m.right=null;if(m.matched.length===g.ids.length)g.result=true}render();}
function reviewHTML(){const due=dueWords(),mistakes=mistakeWords(),todayAnswers=dayData().answered;return heading('Daily review','Review words at spaced intervals to strengthen your memory.')+`<div class="stats-grid mb24"><div class="stat-card"><div class="stat-icon purple">↻</div><div><strong>${due.length}</strong><small>Due for review</small></div></div><div class="stat-card"><div class="stat-icon orange">🎯</div><div><strong>${mistakes.length}</strong><small>Mistake words</small></div></div><div class="stat-card"><div class="stat-icon green">✓</div><div><strong>${todayAnswers}</strong><small>Answers today</small></div></div></div><div class="row-grid"><div class="panel"><span class="badge">SPACED REPETITION</span><h2 class="mt20">Review what you've learned</h2><p>Words come back after 1, 3, 7, 14 or 30 days. Wrong answers are rescheduled sooner.</p><button class="btn btn-primary mt10" data-action="start-review" ${due.length?'':'disabled'}>Review ${due.length} due word${due.length===1?'':'s'} →</button>${!due.length?`<p class="footnote mt20">No words due right now. Learn new words or play a game to build your review schedule.</p>`:''}</div><div class="panel"><span class="badge badge-orange">TARGET YOUR WEAK SPOTS</span><h2 class="mt20">Practice mistakes</h2><p>Get extra practice on words you've answered incorrectly, until you're confident.</p><button class="btn btn-outline mt10" data-action="start-game" data-mode="mistakes" ${mistakes.length?'':'disabled'}>Practice ${mistakes.length} mistake words →</button><div class="spaced-line"></div><p class="footnote">Words are saved only in this browser. They are not yet synced with Notion.</p></div></div>`}
function filteredWords(){let words=allWords();if(ui.libraryCategory!=='all')words=words.filter(w=>w.category===ui.libraryCategory);if(ui.libraryFavorites)words=words.filter(w=>progressFor(w.id).favorite);if(ui.libraryFilter.trim()){const q=ui.libraryFilter.toLowerCase().trim();words=words.filter(w=>`${w.en} ${w.th} ${w.example}`.toLowerCase().includes(q))}return words}
function libraryRowsHTML(){const words=filteredWords();if(!words.length)return `<div class="empty-state"><div class="empty-icon">🔎</div>No matching words found.<p>Try a different search or category.</p></div>`;return words.map(w=>{const p=progressFor(w.id);const cat=CATEGORIES.find(c=>c.id===w.category);return `<div class="word-row"><span class="word-thumb">${h(w.emoji)}</span><div class="word-meta"><h3>${h(w.en)} <span style="font-size:10px;color:#b2b5c7;font-family:'DM Sans'">${h(w.level||'B1')}</span></h3><p>${h(w.th)} · ${h(w.example)}</p></div><div class="word-trail">${p.mastered?'<span class="badge badge-green">Mastered</span>':p.seen?'<span class="badge">Learning</span>':''}<button class="icon-small ${p.favorite?'fav':''}" data-action="favorite" data-word="${h(w.id)}" aria-label="${p.favorite?'Remove favorite':'Add favorite'}">${p.favorite?'★':'☆'}</button><button class="icon-small" data-action="speak" data-word="${h(w.id)}" aria-label="Listen">♫</button></div></div>`}).join('')}
function libraryHTML(){return heading('Your word library',`${allWords().length} words ready to study. Add your own vocabulary anytime.`,`<button class="btn btn-primary" data-action="open-add">+ Add new word</button>`)+`<div class="library-controls"><input class="search-input" id="librarySearch" placeholder="⌕  Search English, Thai or example..." value="${h(ui.libraryFilter)}" aria-label="Search words"/><select class="select-input" id="libraryCategory" aria-label="Choose a category"><option value="all">All categories</option>${CATEGORIES.map(c=>`<option value="${c.id}" ${ui.libraryCategory===c.id?'selected':''}>${c.name}</option>`).join('')}<option value="personal" ${ui.libraryCategory==='personal'?'selected':''}>My words</option></select><button class="btn ${ui.libraryFavorites?'btn-primary':'btn-outline'}" data-action="filter-fav">★ Favorites</button></div><div class="word-list" id="wordList">${libraryRowsHTML()}</div>`}
function progressHTML(){const days=Object.keys(data.days).sort().reverse();const answered=days.reduce((sum,k)=>sum+(data.days[k].answered||0),0);const correct=days.reduce((sum,k)=>sum+(data.days[k].correct||0),0);const percent=answered?Math.round(correct/answered*100):0;const dates=Array.from({length:56},(_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-55+i);return localDate(d)});return heading('My progress','Small efforts add up. Your learning activity at a glance.')+`<div class="stats-grid mb24"><div class="stat-card"><div class="stat-icon purple">✦</div><div><strong>${learnedCount()}</strong><small>Words practiced</small></div></div><div class="stat-card"><div class="stat-icon orange">♨</div><div><strong>${streakCount()}</strong><small>Day streak</small></div></div><div class="stat-card"><div class="stat-icon green">◎</div><div><strong>${percent}%</strong><small>Answer accuracy</small></div></div></div><div class="split-panel"><div class="panel"><h3>Learning activity · last 56 days</h3><p>Deeper purple indicates more answers completed.</p><div class="activity-grid">${dates.map(date=>{const n=dayData(date).answered;return `<div title="${date}: ${n} answers" class="day-cell ${n>=10?'has-3':n>=4?'has-2':n?'has-1':''} ${date===today()?'today':''}"></div>`}).join('')}</div><p class="footnote mt20">Each square represents one day.</p></div><div class="panel"><h3>Learning overview</h3><div class="progress-tiles mt20"><div class="mini-metric"><strong>${masteredCount()}</strong><small>Mastered words</small></div><div class="mini-metric"><strong>${answered}</strong><small>Total answers</small></div><div class="mini-metric"><strong>${days.filter(d=>dayData(d).answered).length}</strong><small>Active days</small></div><div class="mini-metric"><strong>${dueWords().length}</strong><small>Words due</small></div></div></div></div><div class="section-header"><h2>Your word collections</h2></div><div class="path-grid">${CATEGORIES.map(c=>{const words=allWords().filter(w=>w.category===c.id);const learned=words.filter(w=>progressFor(w.id).seen).length;return `<div class="panel"><div style="font-size:28px;margin-bottom:8px">${c.emoji[0]}</div><h3>${c.name}</h3><p>${learned}/${words.length} words practiced</p><div class="track"><span style="width:${words.length?learned/words.length*100:0}%"></span></div></div>`}).join('')}</div>`}
function settingsHTML(){return heading('Settings','Customize your learning and manage the data stored on this device.')+`<div class="split-panel"><div class="panel"><span class="section-kicker">LEARNING PREFERENCES</span><div class="settings-group mt20"><h3>Daily answer goal</h3><p>Choose how many questions to answer each day.</p><select class="select-input" id="goalSetting">${[5,10,15,20,30].map(x=>`<option value="${x}" ${Number(data.settings.goal)===x?'selected':''}>${x} answers / day</option>`).join('')}</select></div><div class="spaced-line"></div><div class="setting-line"><div><h3>Show Thai meanings</h3><p style="margin:0">Get extra support while studying.</p></div><button data-action="toggle-thai" class="toggle ${data.settings.thai?'on':''}" aria-label="Toggle Thai meanings"><span></span></button></div><div class="setting-line"><div><h3>Dark mode</h3><p style="margin:0">A calm evening-friendly theme.</p></div><button data-action="toggle-theme" class="toggle ${data.settings.theme==='dark'?'on':''}" aria-label="Toggle dark mode"><span></span></button></div></div><div class="panel"><span class="section-kicker">YOUR DATA</span><div class="settings-group mt20"><h3>Backup and restore</h3><p>Your practice results and custom words are stored locally in this browser. Export a backup when switching devices.</p><div class="pill-row"><button class="btn btn-primary" data-action="export-data">↓ Export JSON</button><button class="btn btn-outline" data-action="import-data">↑ Import backup</button><input type="file" accept=".json,application/json" id="importInput" hidden /></div></div><div class="spaced-line"></div><div class="settings-group"><h3>Reset progress</h3><p>This permanently clears your study history and custom words on this device only.</p><button class="btn btn-danger" data-action="reset-data">Clear local data</button></div><div class="notice mt20">Verified English vocabulary is imported read-only from your public GitHub Study OS export. Study progress is saved only in this browser and does not sync across devices.</div></div></div><div class="panel mt20"><span class="section-kicker">NOTION · STUDY OS</span><h3 class="mt10">Verified English vocabulary</h3><p>One-way read-only import via your existing public Study OS export. No Notion tokens used.</p><p><b>${(data.notion||[]).length}</b> cards · ${data.notionMeta?.updated?h(data.notionMeta.updated):'not yet synced'}</p><button class="btn btn-primary" data-action="sync-notion" ${notionBusy?'disabled':''}>↻ ${notionBusy?'Refreshing...':'Refresh from Study OS'}</button> <a class="btn btn-outline" href="https://app.notion.com/p/3156c08e298f410a9782144f64a3ae69" target="_blank" rel="noopener noreferrer">Open Notion ↗</a><p class="footnote mt20">Review history remains local. Changes in Notion appear only after the Study OS JSON export updates.</p></div>`}
function openModal(){const m=$('modalLayer');m.hidden=false;m.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="addModalTitle"><div class="modal-head"><h2 id="addModalTitle">Add a new word</h2><button class="icon-small" data-action="close-modal" aria-label="Close">✕</button></div><form id="addWordForm" class="modal-form"><div class="form-group"><label for="newWord">English word *</label><input class="field" id="newWord" maxlength="65" required placeholder="e.g. sustainable"/></div><div class="form-group"><label for="newThai">Thai meaning *</label><input class="field" id="newThai" maxlength="100" required placeholder="e.g. ยั่งยืน"/></div><div class="form-group"><label for="newEmoji">Picture emoji</label><input class="field" id="newEmoji" maxlength="8" placeholder="🌱"/></div><div class="form-group"><label for="newLevel">Level</label><select class="field" id="newLevel"><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option></select></div><div class="form-group wide"><label for="newExample">Example sentence *</label><input class="field" id="newExample" maxlength="220" required placeholder="We need a sustainable solution."/></div><div class="modal-actions wide"><button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Save word</button></div></form></div>`;m.querySelector('#newWord').focus()}
function closeModal(){$('modalLayer').hidden=true;$('modalLayer').innerHTML=''}
function addWord(){const en=$('newWord').value.trim().toLowerCase(),th=$('newThai').value.trim(),example=$('newExample').value.trim(),emoji=$('newEmoji').value.trim()||'💡',level=$('newLevel').value;if(!en||!th||!example)return;if(allWords().some(w=>w.en.toLowerCase()===en)){toast('คำศัพท์นี้มีอยู่แล้ว');return}data.custom.push({id:`custom-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,en,th,example,emoji,category:'personal',level});store();closeModal();render();toast('เพิ่มคำศัพท์เรียบร้อยแล้ว')}
function exportData(){const payload=JSON.stringify({version:1,exportedAt:new Date().toISOString(),...data},null,2);const blob=new Blob([payload],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`vocabloom-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('ส่งออกข้อมูลเป็นไฟล์ JSON แล้ว')}
async function importData(file){if(!file)return;try{const parsed=JSON.parse(await file.text());if(!parsed||!Array.isArray(parsed.custom)||typeof parsed.progress!=='object'||typeof parsed.days!=='object'||!parsed.settings)throw Error('Invalid backup');if(!confirm('นำเข้าข้อมูลนี้แทนข้อมูลเดิมบนอุปกรณ์นี้หรือไม่?'))return;data={progress:parsed.progress||{},days:parsed.days||{},custom:parsed.custom.filter(w=>w&&typeof w.en==='string'&&typeof w.th==='string'&&typeof w.example==='string').map(w=>({...w,category:'personal'})),notion:Array.isArray(parsed.notion)?parsed.notion:[],notionMeta:parsed.notionMeta||null,settings:{...EMPTY_DATA.settings,...parsed.settings}};store();page('home');toast('นำเข้าข้อมูลสำเร็จ')}catch{toast('ไฟล์ไม่ถูกต้อง กรุณาใช้ไฟล์สำรองจาก VocaBloom')}}

const NOTION_EXPORT_URL='https://raw.githubusercontent.com/Cheetos9250/study-os/main/data/cards.json';
function parseNotionExport(payload){
 if(!Array.isArray(payload?.rows))throw Error('Bad export');
 const words=[],seen=new Set();
 for(const row of payload.rows){
  if(row?.Status!=='Verified'||row?.Subject!=='English Vocab')continue;
  const en=String(row.Front||'').trim(),parts=String(row.Back||'').split('|').map(x=>x.trim());
  const th=parts.length>1?parts[1]:parts[0];
  const example=(parts.length>2?parts.slice(2).join('|'):'').split(' = ')[0].trim();
  if(!en||!th||!example||en.length>85||!example.toLowerCase().includes(en.toLowerCase())||seen.has(en.toLowerCase()))continue;
  seen.add(en.toLowerCase());
  words.push({id:'notion-'+String(row.url||en).replace(/[^a-zA-Z0-9]/g,'').slice(-40),en,th,example,emoji:'📰',category:'notion',level:'B1–B2'});
 }
 if(!words.length)throw Error('No usable Verified words');
 return {words,updated:String(payload.updated||'')};
}
async function syncNotionWords(manual=false){
 if(notionBusy)return;notionBusy=true;if(manual&&ui.page==='settings')render();
 const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),15000);
 try{
  const resp=await fetch(NOTION_EXPORT_URL+'?t='+Date.now(),{signal:ctrl.signal,cache:'no-store'});
  if(!resp.ok)throw Error('HTTP '+resp.status);
  const result=parseNotionExport(await resp.json());
  data.notion=result.words;data.notionMeta={updated:result.updated,importedAt:new Date().toISOString()};store();
  if(manual)toast('Imported '+result.words.length+' Verified words');
 }catch(e){if(manual)toast('Refresh failed; locally cached words remain available');console.warn('Study OS refresh:',String(e))}
 finally{clearTimeout(timer);notionBusy=false;if(!ui.learn&&!ui.game)render()}
}

function handleAction(el){const action=el.dataset.action,id=el.dataset.word;switch(action){case'start-learn':initLearn(el.dataset.category);break;case'learn-continue':learnContinue();break;case'speak':{const w=getWord(id);if(w)speak(w.en);break}case'speak-example':{const w=getWord(id);if(w)speak(w.example);break}case'start-game':startGame(el.dataset.mode);break;case'answer-choice':answerGame(el.dataset.choice);break;case'game-next':nextGame();break;case'exit-game':ui.game=null;render();break;case'match-left':matchClick('left',el.dataset.match);break;case'match-right':matchClick('right',el.dataset.match);break;case'start-review':startGame('picture',true);break;case'favorite':{const p=progressFor(id);data.progress[id]={...p,favorite:!p.favorite};store();$('wordList').innerHTML=libraryRowsHTML();break}case'filter-fav':ui.libraryFavorites=!ui.libraryFavorites;render();break;case'open-add':openModal();break;case'close-modal':closeModal();break;case'toggle-thai':data.settings.thai=!data.settings.thai;store();render();break;case'toggle-theme':data.settings.theme=data.settings.theme==='light'?'dark':'light';store();render();break;case'sync-notion':syncNotionWords(true);break;case'export-data':exportData();break;case'import-data':$('importInput').click();break;case'reset-data':if(confirm('ล้างความคืบหน้าและคำศัพท์ส่วนตัวทั้งหมดบนอุปกรณ์นี้?')){data=structuredClone(EMPTY_DATA);store();page('home');toast('ล้างข้อมูลในอุปกรณ์นี้แล้ว')}break;}}
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action){handleAction(action);return}const nav=e.target.closest('[data-page]');if(nav){page(nav.dataset.page);return}});
document.addEventListener('submit',e=>{if(e.target.id==='lessonAnswerForm'){e.preventDefault();learnCheck()}else if(e.target.id==='gameAnswerForm'){e.preventDefault();const v=$('gameAnswer')?.value;if(!v?.trim()){toast('กรุณาพิมพ์คำตอบก่อน');return}answerGame(v)}else if(e.target.id==='addWordForm'){e.preventDefault();addWord()}});
document.addEventListener('input',e=>{if(e.target.id==='librarySearch'){ui.libraryFilter=e.target.value;$('wordList').innerHTML=libraryRowsHTML()}});
document.addEventListener('change',e=>{if(e.target.id==='libraryCategory'){ui.libraryCategory=e.target.value;$('wordList').innerHTML=libraryRowsHTML()}if(e.target.id==='goalSetting'){data.settings.goal=Number(e.target.value)||10;store();updateChrome();toast('เปลี่ยนเป้าหมายรายวันแล้ว')}if(e.target.id==='importInput'){importData(e.target.files?.[0])}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modalLayer').hidden)closeModal()});
$('soundToggle').addEventListener('click',()=>speak('Welcome to VocaBloom. Learn a little, every day.'));
render();
syncNotionWords(false);

</script>
</body>
