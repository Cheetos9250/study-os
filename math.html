<style>
/* Layout: tabbed study sheet (cards / summary / practice) in one centred column. */
:root{
  --paper:#f2f4f8; --surface:#ffffff; --ink:#1a2320; --muted:#5b6a64; --line:#d3dcd7;
  --accent:#2f5fb3; --accent-soft:#dbe5f6; --known:#e6f2d5; --ok:#1c7c4a; --ok-soft:#e2f3e9; --bad:#b3261e; --bad-soft:#fbe6e4;
  --ui:"DM Sans","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --heading:"Outfit","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171a; --surface:#1b2226; --ink:#e7eeea; --muted:#9db0a8; --line:#2d3a40;
  --accent:#8fb2f2; --accent-soft:#1f2e4a; --known:#26331c; --ok:#62d394; --ok-soft:#15301f; --bad:#ff8a80; --bad-soft:#3b1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171a; --surface:#1b2226; --ink:#e7eeea; --muted:#9db0a8; --line:#2d3a40;
  --accent:#8fb2f2; --accent-soft:#1f2e4a; --known:#26331c; --ok:#62d394; --ok-soft:#15301f; --bad:#ff8a80; --bad-soft:#3b1c1a; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16.5px;line-height:1.65}
.wrap{max-width:800px;margin:0 auto;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-bottom:18px}
h1,h2,h3,h4,h5,h6,.front-t{font-family:var(--heading)}
header h1{font-size:clamp(26px,6vw,36px);line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
header span{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:14.5px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{font-family:var(--ui);font-size:11.5px;opacity:.75;margin-left:5px}
.controls{justify-content:space-between;margin:12px 0 16px}
.count{color:var(--muted);font-size:14px;font-family:var(--ui)}
.stage{perspective:1400px}
.card{position:relative;width:100%;height:clamp(300px,64vw,380px);cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);border-radius:10px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 22px 30px;text-align:center;overflow:auto}
.back{transform:rotateY(180deg)}
.card.is-known .face{background:var(--known)}
.cat-tag{position:absolute;top:10px;left:14px;font-size:12.5px;color:var(--muted)}
.hint{position:absolute;bottom:10px;left:0;right:0;font-size:12.5px;color:var(--muted)}
.front-t.big{font-size:clamp(40px,11vw,60px);line-height:1.2}
.front-t{font-size:clamp(21px,5vw,28px);font-weight:700;line-height:1.4;text-wrap:balance}
.back-t{font-size:clamp(17px,4vw,21px);line-height:1.7;max-width:34em}
.back-t b{color:var(--accent)}
.nav{justify-content:center;margin-top:16px;gap:10px}
.btn{font:inherit;font-weight:500;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 18px;cursor:pointer;min-width:46px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.know[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.ref{position:absolute;bottom:10px;left:0;right:0;font:500 12px var(--ui);color:var(--accent)}
.btn.no{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn.yes{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.sync{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:10px;background:var(--accent-soft);margin-top:16px}
.sync p{margin:0;font-size:15px}.sync .ok{color:var(--ok)}.sync .err{color:var(--bad)}
.srs{gap:14px;font:600 14px var(--ui);margin:4px 0 12px}
.srs .n{color:#2f6fd0}.srs .l{color:var(--bad)}.srs .d{color:var(--ok)}
.srs b{font-size:18px;margin-right:3px}
.rate4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate4 .btn{display:flex;flex-direction:column;gap:2px;padding:9px 4px;min-width:0;font-size:15px}
.rate4 .btn small{font:500 12px var(--ui);opacity:.85}
.rate4 .r1{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.rate4 .r2{border-color:var(--line);color:var(--ink)}
.rate4 .r3{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.rate4 .r4{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.show{display:none!important;width:100%;margin-top:16px;padding:13px}
.typebox{margin-top:14px}.typebox input{flex:1;min-width:0;font:inherit;font-size:18px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.typebox input:focus{outline:3px solid var(--accent);outline-offset:1px}
.typebox p{margin:8px 0 0;font-size:16px;min-height:1.5em}.typebox .okk{color:var(--ok);font-weight:600}.typebox .nok{color:var(--bad);font-weight:600}
.rate4 .btn.sug{box-shadow:0 0 0 3px var(--accent)}
.keys{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
/* summary */
.sec{margin:0 0 26px}
.sec h2{font-size:20px;margin:0 0 8px;padding-left:12px;border-left:4px solid var(--accent);line-height:1.4}
.sec .chtag{font-family:var(--ui);font-size:12px;color:var(--accent);display:block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;min-width:100%;background:var(--surface);font-size:15.5px}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top;line-height:1.6}
th{background:var(--accent-soft);font-weight:700;white-space:nowrap}
td:first-child{font-weight:500;min-width:7.5em}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:15px}
/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.qbar{height:4px;background:var(--line);border-radius:2px;margin-bottom:14px}
.qbar i{display:block;height:100%;background:var(--accent);width:0;border-radius:2px;transition:width .25s}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.qmeta b{font-family:var(--ui);color:var(--ink)}
.qtext{font-size:18px;font-weight:500;margin:0 0 14px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font-family:var(--ui);font-weight:600;font-size:13px;color:var(--muted);min-width:16px;padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.6}
.explain{margin-top:14px;border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15.5px}
.explain.good{border-left-color:var(--ok)} .explain.bad{border-left-color:var(--bad)}
.explain b.v{display:block;margin-bottom:2px}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.score .big{font-family:var(--ui);font-size:30px;font-weight:600}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.cell{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:5px;font:500 11px var(--ui);color:var(--muted);cursor:pointer;padding:0}
.cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.no{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.card,.qbar i{transition:none}}
</style>

  <nav class="tabs" role="tablist">

<script>
const D = {"key": "math", "title": "Math for Life", "sub": "สรุป · แฟลชการ์ด · แบบฝึก Ch05–07 (การเงิน · เซต · ความน่าจะเป็นและสถิติ)", "theme": {"paper": "#f2f4f8", "accent": "#2f5fb3", "soft": "#dbe5f6", "accentd": "#8fb2f2", "softd": "#1f2e4a"}, "cats": [["c5", "05 Financial Math"], ["c6", "06 Sets & Venn"], ["c7", "07 Prob & Stats"]], "cards": [["c5", "Ratio กับ Proportion ต่างกันอย่างไร?", "Ratio = เปรียบเทียบขนาดของสองปริมาณ (5 to 4, 5:4, 5/4)\nProportion = สมการว่าสองอัตราส่วนเท่ากัน a/b = c/d", "Ch.5", "05-1"], ["c5", "Property of proportions คืออะไร?", "ผลคูณ means = ผลคูณ extremes\na/b = c/d → b × c = a × d", "Ch.5", "05-2"], ["c5", "ทำ 4 to 52 และ 1½ to 3¾ ให้อยู่ในรูปอย่างต่ำ", "4:52 = 1:13\n1½ : 3¾ = 2:5", "Ch.5", "05-3"], ["c5", "บ้าน 1,650,000 เสียภาษี 4,125 บ้าน 3,200,000 เสียเท่าไร?", "4,125/1,650,000 = x/3,200,000 → x = 8,000 บาท", "Ch.5", "05-4"], ["c5", "Percent คืออะไร และแปลง 8% เป็นทศนิยมอย่างไร?", "อัตราส่วนต่อ 100\nเลื่อนจุดทศนิยมไปซ้าย 2 ตำแหน่ง ตัด % → 8% = 0.08", "Ch.5", "05-5"], ["c5", "โจทย์ “A is P% of W” ตั้งสัดส่วนอย่างไร?", "P/100 = A/W\nW = ตัวที่ตามหลัง “of” · A = ส่วน (amount) · P = rate", "Ch.5", "05-6"], ["c5", "150 is 12% of ? และ 63 is ?% of 420", "150 ÷ 0.12 = 1,250\n63 ÷ 420 = 15%", "Ch.5", "05-7"], ["c5", "เงินเดือน 25,000 ถูกหัก 9% กี่บาท? ภาษี 8,250 = 1.5% ของรายได้ รายได้เท่าไร?", "25,000 × 0.09 = 2,250\n8,250 ÷ 0.015 = 550,000", "Ch.5", "05-8"], ["c5", "สูตร Discount และ Sale price?", "d = p × m (markdown)\ns = p − d = p × c (c = complement = 1 − m)", "Ch.5", "05-9"], ["c5", "รองเท้า 500 ลด 20% · เสื้อ 390 ลด 15% → ส่วนลดและราคาขาย?", "รองเท้า: ลด 100 → 400\nเสื้อ: ลด 58.50 → 331.50", "Ch.5", "05-10"], ["c5", "ลด 20% เหลือ 384 ราคาเดิมเท่าไร? กระเป๋า 3,520 ขาย 2,288 ลดกี่ %?", "p = s/c = 384/0.8 = 480\nc = 2,288/3,520 = 0.65 → markdown 35%", "Ch.5", "05-11"], ["c5", "Sales tax และ Total price คำนวณอย่างไร? (ยาง 4,500 VAT 7%)", "Tax = Price × rate · Total = Price × (1 + rate)\n4,500 × 1.07 = 4,815", "Ch.5", "05-12"], ["c5", "สูตร Simple interest และ Future value?", "I = Prt\nA = P + I = P(1 + rt)", "Ch.5", "05-13"], ["c5", "กู้ 180,000 คืน 261,000 ใน 3 ปี ดอกเบี้ยกี่ %?", "I = 81,000 → r = 81,000 ÷ (180,000 × 3) = 15%", "Ch.5", "05-14"], ["c5", "ฝาก 50,000 ดอกเบี้ย 5¾% แบบ simple 5 ปี ได้เท่าไร?", "A = 50,000(1 + 0.0575 × 5) = 64,375", "Ch.5", "05-15"], ["c5", "Exact กับ Ordinary interest ต่างกันอย่างไร? (กู้ 120,000 18% 174 วัน)", "Exact ÷ 365 · Ordinary ÷ 360 (ธุรกิจส่วนใหญ่ใช้)\nI = 120,000 × 0.18 × 174/360 = 10,440 → คืน 130,440", "Ch.5", "05-16"], ["c5", "Closed-end กับ Open-end credit ต่างกันอย่างไร?", "Closed-end = ผ่อนงวดเท่ากันตามระยะเวลา (installment)\nOpen-end = บัตรเครดิต วงเงินสูงสุด ชำระยืดหยุ่น", "Ch.5", "05-17"], ["c5", "Add-on interest: คอม 24,500 ผ่อน 3 ปี 15% งวดละเท่าไร?", "A = 24,500(1 + 0.15 × 3) = 35,525\nN = 36 → m = 35,525/36 ≈ 986.81", "Ch.5", "05-18"], ["c5", "Average daily balance: 10 วัน @10,000 + 20 วัน @9,500 ดอกเบี้ย 18%?", "ADB = 290,000/30 = 9,666.67\nI = 9,666.67 × 0.18 × 30/365 ≈ 143.01", "Ch.5", "05-19"], ["c5", "สูตร Compound interest?", "A = P(1 + i)^N\ni = r/n · N = nt (n: ปีละ 1, 2, 4, 12, 360)", "Ch.5", "05-20"], ["c5", "ฝาก 10,000 8% 3 ปี Simple vs Compound?", "Simple 12,400 · Compound ≈ 12,597 (10,800 → 11,664 → 12,597)\nทบต้นได้มากกว่า ≈ 197", "Ch.5", "05-21"], ["c5", "1,000,000 ที่ 3% 10 ปี ทบรายปี/ครึ่งปี/ไตรมาส?", "รายปี ≈ 1,343,916 · ครึ่งปี ≈ 1,346,855 · ไตรมาส ≈ 1,348,349", "Ch.5", "05-22"], ["c5", "เงินเดือน 300,000 เงินเฟ้อ 5% อีก 25 ปีต้องได้เท่าไร?", "300,000(1.05)^25 ≈ 1,015,906", "Ch.5", "05-23"], ["c5", "อยากได้ 75,000 ใน 5 ปี ฝาก 5% ทบรายไตรมาส ต้องฝากเท่าไร?", "P = 75,000 ÷ (1.0125)^20 ≈ 58,501", "Ch.5", "05-24"], ["c5", "กรมธรรม์ 5,000,000 ใน 30 ปี เงินเฟ้อ 5% มีค่าเท่าไรวันนี้?", "5,000,000 ÷ 1.05^30 ≈ 1,156,887", "Ch.5", "05-25"], ["c6", "Description กับ Roster method ต่างกันอย่างไร?", "Description = บรรยายเงื่อนไข (เดือนที่มี 30 วัน)\nRoster = แจกแจงสมาชิก {April, June, September, November}", "Ch.6", "06-1"], ["c6", "{counting numbers between 10 and 20} เขียนแบบ roster?", "{11, 12, …, 19} — “between” ไม่รวมปลายทั้งสอง", "Ch.6", "06-2"], ["c6", "{1, 2, 3, …} กับ {0, 1, 2, …} คือเซตอะไร?", "Counting (natural) numbers · Whole numbers", "Ch.6", "06-3"], ["c6", "Equal กับ Equivalent sets ต่างกันอย่างไร?", "Equal = สมาชิกเหมือนกันทุกตัว ({1,2,3} = {3,2,1})\nEquivalent = จำนวนสมาชิกเท่ากัน ({1,2,3} กับ {a,b,c})", "Ch.6", "06-4"], ["c6", "Cardinality คืออะไร? {e, n, j, o, y} มีเท่าไร?", "จำนวนสมาชิกของเซต → 5", "Ch.6", "06-5"], ["c6", "Finite กับ Infinite set ต่างกันอย่างไร?", "Finite = cardinality เป็น 0 หรือจำนวนนับ\nInfinite = ไม่ใช่ เช่น {1000, 2000, 3000, …}", "Ch.6", "06-6"], ["c6", "Universal set กับ Empty set คืออะไร?", "U = สมาชิกทั้งหมดที่พิจารณา ต้องกำหนดและคงที่ในโจทย์\n∅ หรือ { } = ไม่มีสมาชิก มีแบบเดียว cardinality 0", "Ch.6", "06-7"], ["c6", "A ⊆ B, proper และ improper subset คืออะไร?", "A ⊆ B: ทุกสมาชิกของ A อยู่ใน B\nProper (A ⊂ B) = ไม่เท่ากับเซตเดิม · Improper = ตัวเซตเอง", "Ch.6", "06-8"], ["c6", "A = {2, 4, 6, 8} มี subset กี่ชุด proper กี่ชุด?", "2^4 = 16 ชุด → proper 15 ชุด (ไม่นับตัวเอง)", "Ch.6", "06-9"], ["c6", "Venn diagram ใช้อะไรแทนอะไร?", "สี่เหลี่ยม = Universal set · วงกลม/วงรี = เซตต่าง ๆ", "Ch.6", "06-10"], ["c6", "Union, Intersection, Complement คืออะไร?", "A ∪ B = อยู่ใน A หรือ B หรือทั้งคู่\nA ∩ B = อยู่ในทั้งสอง\nA' = อยู่ใน U แต่ไม่อยู่ใน A", "Ch.6", "06-11"], ["c6", "U = {1..9}, A = {2,4,6,8}, B = {1,3,5,7}, C = {5,7} → A∪C, B∪C, A∪B?", "A ∪ C = {2,4,5,6,7,8}\nB ∪ C = {1,3,5,7}\nA ∪ B = {1,…,8}", "Ch.6", "06-12"], ["c6", "สูตรนับ |A ∪ B|?", "|A ∪ B| = |A| + |B| − |A ∩ B|\nคณิต 45 อังกฤษ 41 ทั้งคู่ 12 → 74", "Ch.6", "06-13"], ["c6", "วงดนตรี 50 ออร์เคสตรา 36 ซ้ำ 14 รถ 40 ที่นั่ง 2 คันพอไหม?", "50 + 36 − 14 = 72 ≤ 80 → พอ", "Ch.6", "06-14"], ["c6", "สำรวจ 100 คน: M45 E41 H40, ME15 MH18 EH17, ทั้งสาม 7 → แค่ M, E, H?", "สองวิชาพอดี: ME 8, MH 11, EH 10\nแค่ M 19 · แค่ E 16 · แค่ H 12", "Ch.6", "06-15"], ["c6", "(ต่อ) ไม่เรียนเลยกี่คน? ไม่เรียนคณิตกี่คน?", "รวมอย่างน้อยหนึ่งวิชา 83 → ไม่เรียนเลย 17\nไม่เรียนคณิต 100 − 45 = 55", "Ch.6", "06-16"], ["c6", "เริ่มเติมตัวเลขในโจทย์สำรวจสามเซตจากตรงไหน?", "ตรงกลาง (ทั้งสามเซต) → ส่วนซ้อนสองวง (ลบตรงกลางออก) → วงเดี่ยว → นอกทุกวง", "Ch.6", "06-17"], ["c6", "มื้ออาหาร: B130 L180 D275, BL68 BD112 LD90, ทั้งสาม 58 → อย่างน้อยหนึ่งมื้อ / มื้อเดียว?", "แค่เช้า 8 · แค่กลางวัน 80 · แค่เย็น 131 · BL 10 · BD 54 · LD 32\nอย่างน้อยหนึ่งมื้อ 373 · มื้อเดียว 219", "Ch.6", "06-18"], ["c6", "(ต่อ) กินแค่มื้อเย็น และกินสองมื้อพอดีกี่คน?", "แค่มื้อเย็น 131 · สองมื้อพอดี 10 + 54 + 32 = 96", "Ch.6", "06-19"], ["c7", "Experiment, Sample space, Event คืออะไร?", "Experiment = การสังเกตเหตุการณ์\nSample space = เซตผลลัพธ์ทั้งหมด\nEvent = subset ของ sample space", "Ch.7", "07-1"], ["c7", "โยนเหรียญ 1 ครั้งและทอยเต๋า 1 ลูก sample space มีกี่ผลลัพธ์?", "2 × 6 = 12 (ใช้ tree diagram ช่วยแจกแจง)", "Ch.7", "07-2"], ["c7", "สูตรความน่าจะเป็นเมื่อทุกผลลัพธ์มีโอกาสเท่ากัน?", "P(E) = s/n\ns = จำนวนที่สนใจ · n = จำนวนใน sample space", "Ch.7", "07-3"], ["c7", "ไพ่ 52 ใบ: P(ace), P(heart), P(face card)?", "1/13 · 1/4 · 12/52 = 3/13", "Ch.7", "07-4"], ["c7", "“or” และ “and” แปลเป็นอะไรในความน่าจะเป็น?", "or = ∪ (union) · and = ∩ (intersection)\nP(A ∪ B) = P(A) + P(B) − P(A ∩ B)", "Ch.7", "07-5"], ["c7", "ไพ่: P(สอง or คิง), P(สอง and heart), P(สอง or heart), P(สอง and คิง)?", "8/52 = 2/13 · 1/52 · 16/52 = 4/13 · 0", "Ch.7", "07-6"], ["c7", "คำว่า statistics มีความหมาย 2 แบบอะไร?", "1) ข้อมูลจำนวนมาก รวมตาราง/แผนภูมิ\n2) วิธีเก็บ วิเคราะห์ และตีความข้อมูล", "Ch.7", "07-7"], ["c7", "Frequency distribution และ class interval คืออะไร?", "ตารางจัดข้อมูลเป็นกลุ่ม (classes) และนับความถี่\nInterval = ผลต่างของขอบล่างของ class ที่ติดกัน", "Ch.7", "07-8"], ["c7", "Mean, Median, Mode คืออะไร?", "Mean = ผลรวม ÷ จำนวน\nMedian = ค่ากลางหลังเรียง (คู่ = เฉลี่ยสองตัวกลาง)\nMode = ค่าที่เกิดบ่อยที่สุด (ไม่มี หรือมีหลายค่าได้)", "Ch.7", "07-9"], ["c7", "โบว์ลิ่ง จันทร์ vs พฤหัส: mean/median/mode บอกอะไร?", "จันทร์ 185/175/160     if(r===1){ s.step=0; s.due=now+LEARN[0]*MIN; }
    else if(r===2){ s.due=now+(s.step===0?6:LEARN[1])*MIN; }

function lbl(s){
  if(s.st==='learn'){ const m=Math.max(1,Math.round((s.due-Date.now())/MIN)); return m<60?m+' min':Math.round(m/60)+' h'; }
  return s.ivl<30?s.ivl+' d':s.ivl<365?(s.ivl/30).toFixed(1).replace('.0','')+' mo':(s.ivl/365).toFixed(1).replace('.0','')+' y';

function errText(e,writing){

    case "server_unavailable": case "upstream_error": return writing?"Notion did not reply; it may have saved. Check the chapter page in Notion before trying again.":"Notion is temporarily unreachable; try again shortly";

   }catch(e){return ''}

    const rst=Math.max(A.rst||0,B.rst||0); out.study.rst=rst;
    const ids=new Set([...Object.keys(A.ans||{}),...Object.keys(B.ans||{})]);
    ids.forEach(id=>{
      const ha=A.ans&&A.ans[id]!==undefined, hb=B.ans&&B.ans[id]!==undefined;
      const ta=(A.ats||{})[id]||0, tb=(B.ats||{})[id]||0;
      const useA=ha&&(!hb||ta>=tb), v=useA?A.ans[id]:B.ans[id], t=useA?ta:tb;
      if(!(ha||hb)) return; if(rst&&t<rst) return;
      out.study.ans[id]=v; out.study.ats[id]=t;
      const rvx=useA?(A.rv||{})[id]:(B.rv||{})[id]; if(rvx)(out.study.rv=out.study.rv||{})[id]=rvx;
    });
    out.study.known=[...new Set([...(A.known||[]),...(B.known||[])])];
    const SA=(a.srs||{}).s||{}, SB=(b.srs||{}).s||{};
    new Set([...Object.keys(SA),...Object.keys(SB)]).forEach(id=>{
      const x=SA[id], y=SB[id]; if(!x){ out.srs.s[id]=y; return; } if(!y){ out.srs.s[id]=x; return; }
      out.srs.s[id]=((x.ts||0)>=(y.ts||0))?x:y;
    });
    const MA=(a.srs||{}).m||{day:0,newDone:0}, MB=(b.srs||{}).m||{day:0,newDone:0};
    out.srs.m = MA.day>MB.day?MA : MB.day>MA.day?MB : {day:MA.day,newDone:Math.max(MA.newDone||0,MB.newDone||0)};
    return out;
  }
  function apply(m){
    applying=true;
    try{
      store.ans=m.study.ans; store.ats=m.study.ats; store.rst=m.study.rst; store.known=m.study.known; store.rv=m.study.rv||{}; window.StudyReview&&StudyReview.seed(store,QS,Date.now()); save();
      srs=m.srs.s; meta=m.srs.m; saveS();
      try{ buildDeck(); renderQ(); cardsRow(); if(!shown) renderCard(); }catch(e){}
    } finally { applying=false; }
  }
  async function sync(manual,auto){
    // Deliberate manual click only; never run on page load, visibility or rating.
    if(!manual||busy) return;
    const base=await cfg();
    if(!base){ say('api is not set in data/config.json'); return; }
    if(!key()){ if(!auto)askKey(); return; }
    if(auto&&progressKeyName===LSK){ say('Auto sync works only with the separate Progress Worker'); return; }
    if(!auto&&!window.confirm('Sync will read and write the scores for '+D.key+' to the Cloudflare Worker.\n\nIf the Worker does not support ETag/If-Match, this older sync can overwrite scores when another device syncs at the same time. Back up first and avoid syncing two devices at once.\n\nSync manually now?')) return;
    busy=true;say('Checking revision and syncing…',true);
    try{
      const url=base+'/progress/'+D.key;
      let done=false;
      for(let attempt=1;attempt<=6;attempt++){
        const r=await fetch(url,{headers:hdr(),cache:'no-store'});
        if(r.status===401){
          say('Wrong sync key; tap the button to set it again');
          try{localStorage.removeItem(progressKeyName);}catch(e){}
          busy=false;paint();return;
        }
        if(!r.ok)throw Error('GET HTTP '+r.status);
        const etag=(r.headers?.get?.('X-Sync-Revision')??r.headers?.get?.('ETag'))||'';
        const revision=/^"[0-9]+"$/.test(etag)?etag:'';
        if(auto&&!revision)throw Error('Worker sent no revision (ETag), so auto sync is off; use manual sync instead');
        const originalTag=r.headers?.get?.('ETag')||'';
        const customRev=r.headers?.get?.('X-Sync-Revision');
        // A weak tag or malformed application version indicates broken CAS.
        // Never treat it as a safe legacy manual-sync fallback.
        if(!revision&&(customRev!==null&&customRev!==undefined||/^W\//.test(originalTag)))
          throw Error('Worker sent an unsafe revision number; sync stopped to protect your data');
        const remote=await r.json();
        if(remote!==null&&(typeof remote!=='object'||Array.isArray(remote)||remote.error))
          throw Error('Invalid Worker data');
        const snapshot=local(),baseline=JSON.stringify(snapshot);
        const joined=merge(snapshot,remote||{});
        const headers=revision?{...hdr(),'If-Match':revision}:hdr();
        const p=await fetch(url,{method:'PUT',headers,body:JSON.stringify(joined)});
        if(revision&&(p.status===409||p.status===412))continue;
        if(p.status===428)throw Error('Worker requires If-Match but sent no ETag');
        if(!p.ok)throw Error('PUT HTTP '+p.status);
        if(JSON.stringify(local())!==baseline){
          if(revision)continue;
          throw Error('Scores changed during the older sync; local scores were not overwritten');
        }
        apply(joined);
        done=true;break;
      }
      if(!done)throw Error('Data changed concurrently more than 6 times; local scores are kept');
      dirtyFlag=false;say('Synced '+hhmm(),true);
    }catch(e){say('Sync failed: '+String(e.message||e));}
    busy=false;paint();
  }
  /* Opt-in automatic sync: only with the separate Progress Worker (progress_api) and a CAS revision header. */
  const AUTOK='study-sync-auto-v1';
  let dirtyFlag=false,autoTimer=null,autoBtn=null;
  const autoOn=()=>{try{return localStorage.getItem(AUTOK)==='1'}catch(e){return false}};
  const autoReady=()=>!!(api&&key()&&progressKeyName!==LSK);
  function schedule(ms){ clearTimeout(autoTimer); autoTimer=setTimeout(()=>{ if(autoOn()&&autoReady()&&!document.hidden||dirtyFlag&&autoOn()&&autoReady()) sync(true,true); },ms); }
  function setAuto(on){ try{ if(on)localStorage.setItem(AUTOK,'1'); else localStorage.removeItem(AUTOK); }catch(e){ say('Could not save the auto sync setting'); return; } if(on){arm();schedule(500);} else clearTimeout(autoTimer); say(on?'Auto sync is on':'Auto sync is off',true); paint(); }
  let armed=false;
  function arm(){ if(armed)return; armed=true;
    setInterval(()=>{ if(!document.hidden&&autoOn()&&autoReady()) sync(true,true); },300000);
    document.addEventListener('visibilitychange',()=>{ if(!autoOn()||!autoReady())return; if(document.hidden){ if(dirtyFlag) sync(true,true); } else schedule(800); }); }
  function askKey(){
    let k=''; try{ k=window.prompt(progressKeyName===LSK?
     'Enter the SYNC_KEY for the original Cloudflare Worker.\n\nThis older page no longer syncs automatically; you will be asked to confirm one manual sync.':
     'Enter the key for the separate Progress Worker.\n\nDo not reuse the original or staging Worker key; this key is only for the new Progress endpoint.')||''; }catch(e){}
    k=k.trim(); if(!k) return;
    try{
     const scoped=progressKeyName===LSK?k:JSON.stringify({endpoint:api,key:k});
     localStorage.setItem(progressKeyName,scoped);
    }catch(e){say('Could not save the key on this device, so nothing was synced');return}
    paint(); try{ renderSync(); }catch(e){} sync(true);
  }
  function paint(){ if(btnEl) btnEl.textContent=key()?'☁ Sync manually':'☁ Set sync key'; if(autoBtn){ const can=progressKeyName!==LSK&&!!key(); autoBtn.hidden=!can; autoBtn.textContent=autoOn()?'⟳ Auto: on':'⟳ Auto: off'; autoBtn.setAttribute('aria-pressed',autoOn()); } }
  function mount(){
    box=document.createElement('div');
    box.className='cloud-sync-bar';
    box.style.cssText='position:fixed;right:12px;bottom:12px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--surface,#fff);color:var(--ink,#1c1c1c);border:1px solid var(--line,#bbb);border-radius:999px;padding:6px 12px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.12)';
    msgEl=document.createElement('span'); msgEl.setAttribute('role','status');
    btnEl=document.createElement('button'); btnEl.type='button'; btnEl.style.cssText='border:0;background:transparent;font:inherit;color:inherit;cursor:pointer;font-weight:600;padding:2px 4px';
    btnEl.onclick=async()=>{ await cfg(); if(!key()) askKey(); else sync(true); };
    autoBtn=document.createElement('button'); autoBtn.type='button'; autoBtn.hidden=true; autoBtn.style.cssText=btnEl.style.cssText;
    autoBtn.onclick=()=>{ if(autoOn()){ setAuto(false); return; } if(window.confirm('Turn on auto sync?\n\nThis page will read and write the scores for '+D.key+' with your own Progress Worker from time to time (on open, after answering and every few minutes), merging item by item without overwriting.\n\nUse the same key on every device. Turn it off any time with the same button.')) setAuto(true); };
    box.append(msgEl,btnEl,autoBtn); document.body.appendChild(box); paint();
  }
  mount();
  say(autoOn()?'Auto sync is on':'Cloud Sync: auto off',true);
  cfg().then(()=>{ try{ renderSync(); }catch(e){} paint(); if(autoOn()&&autoReady()){arm();schedule(1500);} });
  // LocalStorage writes still happen immediately in save() and saveS().
  // Do not dispatch background GET/PUT even if the browser already has a SYNC_KEY.
  return { dirty(){ if(autoOn()&&!applying&&autoReady()){ dirtyFlag=true; schedule(20000); } },
    ready(){ return !!(api&&key()); },
    reviewReady(){return !!(contentApi&&contentKey())},
    reviewApi:async()=>{await cfg();return contentApi;},
    reviewHdr:()=>({'X-Sync-Key':contentKey(),'Content-Type':'application/json'}),
    api:()=>api, hdr, sync };
})();
