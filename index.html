<title>Today — Study OS</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans','IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,.mono{font-family:var(--mono)}
a{color:inherit}
.cover{position:relative;height:clamp(180px,30vw,320px);background:linear-gradient(120deg,#f6c1d6 0%,#d9b8f2 45%,#9ec5f5 100%) center/cover no-repeat}
.cover-tools{position:absolute;z-index:2;right:max(14px,env(safe-area-inset-right));bottom:10px;display:flex;gap:8px;opacity:.9}
.cover-tools button{font:600 12px var(--mono);min-height:36px;padding:0 12px;border-radius:8px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.88);color:#333;cursor:pointer}
.page{max-width:1040px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-right)) 90px max(18px,env(safe-area-inset-left))}
.head{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:-52px}
.head{pointer-events:none}.head>*{pointer-events:auto}
.avatar{width:104px;height:104px;border-radius:50%;background-color:var(--bg);display:grid;place-items:center;font-size:56px;box-shadow:0 0 0 4px var(--bg);border:0;padding:0;cursor:pointer;background-repeat:no-repeat;background-size:contain;background-position:center;flex:none}
.avatar.img{font-size:0;border-radius:0;box-shadow:none;background-color:transparent}
h1{font-size:clamp(30px,5vw,40px);margin:0;letter-spacing:-.5px;line-height:1.1}
.date{color:var(--muted);font-size:15px;margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}
.chip{display:flex;align-items:baseline;gap:8px;padding:10px 16px;border-radius:14px;background:var(--panel);text-decoration:none;min-height:48px}
.chip b{font:700 24px var(--mono)}.chip span{font-size:14px;color:var(--muted)}
.chip.warn b{color:var(--red)}.chip.soon b{color:var(--orange)}
h2{font-size:clamp(19px,3vw,24px);margin:40px 0 14px;display:flex;align-items:center;gap:8px}
.sec-link{margin-left:auto;font:500 13px var(--mono);color:var(--accent);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.box{border-radius:16px;padding:16px 18px;background:var(--panel)}
.plan{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan input{width:24px;height:24px;margin-top:2px;accent-color:var(--accent)}
.plan h3{font-size:15px;margin:0 0 2px;line-height:1.4}.plan li.done h3{color:var(--muted);text-decoration:line-through}
.plan p{margin:0;font-size:13px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.acts a{font:500 13px var(--mono);text-decoration:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 12px;min-height:40px;display:inline-flex;align-items:center}
.acts a.main{background:var(--accent);border-color:var(--accent);color:#fff}
.tag{font:600 11px var(--mono);padding:2px 8px;border-radius:6px;background:var(--blue-soft);margin-right:6px}
.pomo{border-radius:16px;color:#fff;background:linear-gradient(180deg,#a07fa0 0%,#6c6ea6 55%,#27468a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 16px;min-height:240px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tab{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:0 11px;min-height:40px;font:13px var(--mono);cursor:pointer;white-space:nowrap}
.tab[aria-pressed=true]{background:#fff;color:#222}
.clock{font:700 clamp(56px,9vw,84px)/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-1px}
.pbtn{display:flex;gap:10px}.pbtn button{border:0;border-radius:999px;padding:0 28px;min-height:48px;font:600 17px var(--mono);cursor:pointer;background:#fff;color:#222}
.pbtn button.ghost{background:rgba(255,255,255,.25);color:#fff;padding:0 18px}
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.exam{border-radius:14px;padding:14px 16px;background:var(--panel);border-left:5px solid var(--accent)}
.exam.soon{border-left-color:var(--orange)}.exam.urgent{border-left-color:var(--red)}
.exam .n{font:700 34px/1 var(--mono)}.exam .n small{font-size:14px;font-weight:500;margin-left:4px;color:var(--muted)}
.exam.urgent .n{color:var(--red)}.exam.soon .n{color:var(--orange)}
.exam p{margin:6px 0 0;font-size:13px}.exam .when{color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.toolbar select,.toolbar input,.toolbar button{font:14px var(--mono);padding:0 10px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.toolbar .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:0 18px}
.row{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto 28px;gap:10px;align-items:center;min-height:50px;border-bottom:1px solid var(--line);font-size:15px}
.row .t{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row.done .t{color:var(--muted);text-decoration:line-through}
.left{font:600 12px var(--mono);padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--blue-soft)}
.left.late{background:var(--hi);color:var(--hi-t)}.left.today{background:var(--med);color:var(--med-t)}
.pri{font:600 12px var(--mono);padding:2px 9px;border-radius:6px}.pri.High{background:var(--hi);color:var(--hi-t)}.pri.Medium{background:var(--med);color:var(--med-t)}.pri.Low{background:var(--low);color:var(--low-t)}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:14px 4px;margin:0}
.moreBtn{border:0;background:none;color:var(--muted);font:14px var(--mono);min-height:46px;cursor:pointer}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.subj{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);position:relative}
.subj .cv{height:clamp(120px,16vw,170px);display:grid;place-items:center;font-size:32px;background-size:cover;background-position:center}.subj .cv.has{font-size:0}
.s-acc .cv{background-color:#bfe6cf}.s-eco .cv{background-color:#fbd9b5}.s-math .cv{background-color:#d3cffa}.s-voc .cv{background-color:#c9dcfb}.s-zh .cv{background-color:#fbc9c9}
.subj .pic{position:absolute;top:8px;right:8px;min-width:44px;min-height:44px;padding:0 10px;border:0;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font:700 20px/1 var(--mono);letter-spacing:1px;cursor:pointer;opacity:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.subj:hover .pic,.subj:focus-within .pic{opacity:1}@media(hover:none){.subj .pic{opacity:1}}
.subj .b{padding:12px 14px 14px}.subj h3{font-size:16px;margin:0 0 2px}.subj .sub{font-size:12px;color:var(--muted);margin:0 0 10px}
.subj .st{display:flex;gap:14px;font-size:13px;margin-bottom:8px}.subj .st b{font:700 18px var(--mono);display:block;line-height:1.1}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:10px}.bar i{display:block;height:100%;background:var(--green)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media(max-width:820px){.top{grid-template-columns:1fr}}
@media(max-width:520px){.row{grid-template-columns:24px minmax(0,1fr) 28px}.row .left,.row .pri{grid-column:2;justify-self:start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#imgMenu{position:fixed;z-index:90;width:228px;display:grid;gap:2px;padding:6px;border-radius:12px;background:var(--bg);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#imgMenu button{font:14px var(--mono);text-align:left;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:none;color:var(--text);cursor:pointer}
#imgMenu button:hover{background:var(--panel)}#imgMenu [data-act=remove]{color:var(--red)}
.toolbar input.grow{flex:1;min-width:160px}
.plan .acts{margin-top:6px}.plan .acts a{min-height:36px}
.classes{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}.classes:empty{display:none}
.cls{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:var(--panel);min-height:48px;text-decoration:none}
.cls b{font:700 15px var(--mono)}.cls span{font-size:13px;color:var(--muted)}.cls.now{box-shadow:inset 0 0 0 2px var(--accent)}.cls.done{opacity:.5}
.show-done{display:flex;align-items:center;gap:8px;min-height:44px;font-size:13px;color:var(--muted);margin-left:auto}

</style>
<link rel="stylesheet" href="assets/study-world.css?v=9">
<style>
.bk{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:18px 0 0;padding:12px 14px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--panel)}
.bk svg{width:22px;height:22px;flex:none}
.bk p{margin:0;flex:1;min-width:220px;font-size:14px;line-height:1.45}.bk p b{display:block;font-size:15px}
.cont{display:flex;align-items:stretch;gap:14px;margin:18px 0 0;padding:14px 18px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--panel);color:inherit;text-decoration:none;min-height:44px}
.cont[hidden]{display:none}.cont:focus-visible{outline:3px solid var(--focus,#2f6bff);outline-offset:3px}
.cont .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cont .k{font:900 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--acc-t,var(--red))}
.cont b{font:700 19px/1.25 var(--num,serif)}.cont .q{font-size:14px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cont .w{font-size:13px;opacity:.75;margin-top:2px}
.cont .cd{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:112px;max-width:42%;padding-left:14px;border-left:2.5px solid var(--ink);text-align:center}
.cont .cd .n{font:700 46px/1 var(--num,serif);font-variant-numeric:tabular-nums}.cont .cd.hot .n{color:var(--red)}
.cont .cd .l{font-size:12.5px;font-weight:700;line-height:1.3;margin-top:4px}
/* practice goal (scripts/study-motivation.js) */
.qg .qgo{flex:none;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:120px;padding-left:14px;border-left:2.5px solid var(--ink)}
.qg .qgo a,.qg .qgo button{min-height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;border:2px solid var(--ink);border-radius:var(--r-s);background:var(--panel);color:inherit;font:700 14px var(--ui);text-decoration:none;cursor:pointer}
.qg .qgo a{background:var(--ink);color:var(--accent-ink)}
.qg.met .bar i{background:var(--ok,#1c7c4a)}
@media(max-width:560px){.qg{flex-wrap:wrap}.qg .qgo{flex-direction:row;border-left:0;padding-left:0;width:100%}.qg .qgo>*{flex:1}}
/* WordNest daily goal (scripts/study-wordnest.js) */
.wng{display:flex;align-items:center;gap:14px;margin:12px 0 0;padding:12px 18px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--panel);color:inherit;text-decoration:none;min-height:44px}
.wng-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 0}.wng-add{min-height:44px;padding:0 16px;border:2.5px solid var(--ink);border-radius:var(--r-s,8px);background:var(--panel);color:var(--text);font:900 14px var(--ui);cursor:pointer}.wng-hint{font-size:13px;color:var(--muted)}
.wng-dlg{max-width:min(440px,calc(100vw - 32px));border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--panel);color:var(--text);padding:18px}.wng-dlg h2{margin:0 0 8px;font:700 22px var(--num)}.wng-dlg label{display:block;font-weight:900;margin:10px 0 4px}.wng-dlg input{width:100%;min-height:44px;border:2px solid var(--ink);border-radius:var(--r-s,8px);background:var(--panel);color:var(--text);font:600 16px var(--ui);padding:0 10px}.wa-msg{min-height:20px;margin:8px 0 0;font-size:14px}.wa-acts{display:flex;gap:8px;margin-top:10px}.wa-acts button{min-height:44px;padding:0 16px;border:2.5px solid var(--ink);border-radius:var(--r-s,8px);background:var(--panel);color:var(--text);font:900 14px var(--ui);cursor:pointer}.wa-acts .main{background:var(--ink);color:var(--paper)}
.wng[hidden]{display:none}.wng:focus-visible{outline:3px solid var(--focus,#2f6bff);outline-offset:3px}
.wng .wt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.wng .k{font:900 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--acc-t,var(--red))}
.wng b{font:700 18px/1.25 var(--num,serif)}.wng .q{font-size:14px;line-height:1.4;color:var(--muted)}
.wng .bar{height:10px;border:2px solid var(--ink);border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:4px;max-width:420px}
.wng .bar i{display:block;height:100%;background:var(--acc)}
.wng .wdue{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:96px;padding-left:14px;border-left:2.5px solid var(--ink);text-align:center}
.wng .wdue .n{font:700 40px/1 var(--num,serif);font-variant-numeric:tabular-nums}.wng .wdue .l{font-size:12.5px;font-weight:700;margin-top:4px}
.wng.met .k::after{content:" ✓"}
@media(max-width:420px){.wng{padding:12px 14px}.wng .wdue{min-width:76px}.wng .wdue .n{font-size:32px}}
@media(max-width:420px){.cont{padding:12px 14px}.cont .cd{min-width:86px}.cont .cd .n{font-size:38px}}
.bk .acts{margin:0;flex-basis:100%;padding-left:36px}.bk .bk-miss{display:block;margin-top:2px;font-weight:700}.bk .bk-msg{flex-basis:100%;margin:0;padding-left:36px;font-size:14px;font-weight:700;color:var(--green,#1f7448)}.bk .bk-msg.bad{color:var(--red,#c21f2f)}.bk .acts a[aria-disabled=true]{opacity:.5;pointer-events:none}
/* wide screens: the reminder sits in the empty space beside the title */
@media(min-width:760px){.headrow{display:flex;align-items:flex-end;gap:24px}.headrow .head{flex:none}.headrow .bk{flex:1 1 380px;max-width:560px;margin:18px 0 4px auto}.headrow .bk p{min-width:0}}
/* Today: ink manga panels, speech bubble, hatched timer (after study-world.css) */
.cover{height:clamp(170px,26vw,280px)}
.head{margin-top:-48px;gap:12px}
.avatar{width:96px;height:96px;border-radius:4px;font-size:48px}
.avatar.img{border-radius:0}
.chips.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.7fr);gap:10px;margin:22px 0 0;padding:0;background:none}
.sb{display:flex;flex-direction:column;justify-content:flex-start;gap:2px;padding:12px 18px 14px;min-height:124px;text-decoration:none;color:inherit;background:var(--panel);border:var(--bw) solid var(--ink);border-radius:var(--r)}
a.sb:hover{background:var(--dots),var(--panel)}
.sb .n{font:700 clamp(46px,6vw,62px)/1.05 var(--num);color:var(--text);font-variant-numeric:tabular-nums}
.sb .l{font:900 14px/1.2 var(--ui);color:var(--text)}
.sb .s{font:500 13px/1.35 var(--ui);color:var(--muted);margin-top:auto}
.sb.alert .n{color:var(--acc-t)}
.sb.next{background:var(--hatch),var(--panel);padding:12px 14px 14px;justify-content:space-between}
.sb.next .bub{padding:10px 24px 12px;max-width:520px}
.sb.next .bub .fx{display:block;font:900 16px/1.3 var(--ui)}
.sb.next .bub .n{display:block;font-size:clamp(32px,4vw,42px);color:var(--acc-t)}
.sb.next .bub .n small{font:900 16px var(--ui);color:var(--text);margin-left:6px}
.sb.next .s{align-self:flex-end;color:var(--text);font-weight:900;margin-top:6px}
.top{align-items:start}
.avatar .mark{width:64px;height:64px;color:var(--text)}.avatar.img .mark{display:none}
/* text over hatching sits in a framed caption box, not loose knockout patches */
.sb.next .s{background:var(--panel);border:2px solid var(--ink);border-radius:4px;padding:3px 8px;line-height:1.2}
.pomo{color:var(--text);border:var(--bw) solid var(--ink);border-radius:var(--r);min-height:250px;gap:14px;padding:20px 18px;background:var(--hatch-ink),var(--panel)}
.pomo .pmeta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.pomo .pmeta select{min-height:40px;border:2.5px solid var(--ink);border-radius:6px;background:var(--panel);color:var(--text);font:700 13px var(--ui);padding:0 8px;max-width:160px}
.pomo .tabs{display:inline-flex;gap:0;padding:0;border:2.5px solid var(--ink);border-radius:6px;background:var(--panel);flex-wrap:nowrap;overflow:hidden}
.pomo .tab{border:0;border-radius:0;color:var(--text);font:900 13px var(--ui);padding:0 12px;min-height:40px;background:none}
.pomo .tab+.tab{border-left:2px solid var(--ink)}
.pomo .tab[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.clock{font:700 clamp(58px,7.6vw,80px)/1.05 var(--num);color:var(--text);background:var(--panel);border:var(--bw) solid var(--ink);padding:6px 20px 8px;font-variant-numeric:tabular-nums}
.pbtn button{border-radius:6px;font:900 16px var(--ui);min-height:48px;background:var(--acc);color:var(--acc-ink);border:var(--bw) solid var(--ink);text-transform:capitalize}
.pbtn button.ghost{background:var(--panel);color:var(--text);display:inline-grid;place-items:center;padding:0 14px}
.pbtn button.ghost svg{width:20px;height:20px}
.plan li{grid-template-columns:28px minmax(0,1fr) auto;align-items:center;padding:14px 0}
.plan li .acts{margin:0;justify-content:flex-end}
/* chapter items carry 3–4 links: put them under the text so the title keeps its width */
.plan li.stack{grid-template-columns:28px minmax(0,1fr)}.plan li.stack .acts{grid-column:2;justify-content:flex-start;margin-top:8px}
.plan h3{font-size:16px;font-weight:900;margin:0}
.classes{gap:8px}
.cls{background:var(--panel);border:2.5px solid var(--ink);border-radius:6px;gap:10px;padding:6px 16px 6px 6px}
.cls b{font:700 14px var(--num);color:var(--text)}
.cls.now{background:var(--hatch),var(--panel)}
.exams{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:1000px){.exams{grid-template-columns:repeat(4,minmax(0,1fr))}}
.exam{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"n t" "n j";align-items:center;column-gap:14px;row-gap:6px;padding:12px 14px}
.exam .n{grid-area:n;min-width:52px;text-align:center}.exam>div:not(.n){grid-area:t}.exam .jersey{grid-area:j;justify-self:start}
.exam .n small{display:block;margin:4px 0 0}
.exam p{margin:0;font-size:14px}.exam .when{font-size:13px}
.subjects{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}

(function(){

const T=window.StudyToday,$=s=>document.querySelector(s),KEY='studyos.home.v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(k){try{return localStorage.getItem(k);}catch{return null;}}
function load(){try{const v=JSON.parse(read(KEY)||'{}');return v&&typeof v==='object'?v:{};}catch{return {};}}
let st=load();st.tasks=Array.isArray(st.tasks)?st.tasks:[];st.covers=st.covers&&typeof st.covers==='object'&&!Array.isArray(st.covers)?st.covers:{};

function saveSettings(){try{localStorage.setItem(T.SETTINGS_KEY,JSON.stringify(settings));window.StudyCloud&&StudyCloud.dirty();return true;}catch{alert('Could not save.');return false;}}
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const parts=iso=>{const [y,m,d]=iso.split('-').map(Number);return {y,m:m-1,d};};

const shortDay=iso=>{const p=parts(iso);return p.d+' '+MO[p.m].slice(0,3);};

/* ---------- images (local only; GIFs keep their animation, icon keeps transparency; or an https image link) ---------- */
const GIF_MAX=1.5*1024*1024,LINK=/^https:\/\/[^\s"'()\\<>]{4,1990}$/;
const cssUrl=d=>'url("'+d+'")';
/* Google Drive share links open a web page, not the image: turn them into direct image addresses. */
function driveId(v){const m=String(v).match(/^https:\/\/(?:drive|docs)\.google\.com\/(?:file\/d\/|open\?(?:[^#]*&)?id=|uc\?(?:[^#]*&)?id=)([\w-]{20,})/);return m?m[1]:'';}
function imageCandidates(v){const id=driveId(v);const list=id?['https://lh3.googleusercontent.com/d/'+id,'https://drive.google.com/uc?export=view&id='+id]:[v];return list.filter(u=>LINK.test(u));}

function pickImage(file,maxW,q,cb,alpha){
 file.slice(0,6).arrayBuffer().then(buf=>{
  const head=String.fromCharCode(...new Uint8Array(buf));
  if(head.startsWith('GIF8')){
   if(file.size>GIF_MAX){alert('GIF is too large ('+(file.size/1048576).toFixed(1)+' MB). Max 1.5 MB, or use "Paste image link".');return;}
   const r=new FileReader();r.onload=()=>cb('data:image/gif;base64,'+String(r.result).split(',')[1]);r.onerror=()=>alert('Could not open image.');r.readAsDataURL(file);return;
  }

  img.onload=()=>{const w=Math.min(maxW,img.width),h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);cb(alpha&&file.type!=='image/jpeg'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',q));
   if(converted)alert('The iPad sent this GIF as a still image, so it will not move. Use "Paste image link" (for example a Giphy or Tenor link), or pick the file from the Files app instead of Photos.');};
  img.onerror=()=>{URL.revokeObjectURL(u);alert('Could not open image.');};img.src=u;
 }).catch(()=>alert('Could not open image.'));
}
const cover=$('#cover'),avatar=$('#avatar');
function paintImages(){
 cover.style.backgroundImage=st.cover?cssUrl(st.cover):'';
 if(st.avatar){avatar.style.backgroundImage=cssUrl(st.avatar);avatar.classList.add('img');}else{avatar.style.backgroundImage='';avatar.classList.remove('img');}
 document.querySelectorAll('[data-cv]').forEach(el=>{const d=st.covers[el.dataset.cv];if(d){el.style.backgroundImage=cssUrl(d);el.classList.add('has');}else{el.style.backgroundImage='';el.classList.remove('has');}});
}
/* one small menu for cover, icon and card images */
const SLOTS={cover:{w:1400,q:.8,get:()=>st.cover,set:v=>{if(v)st.cover=v;else delete st.cover;}},
 avatar:{w:256,q:.85,alpha:true,get:()=>st.avatar,set:v=>{if(v)st.avatar=v;else delete st.avatar;}}};
const slot=k=>SLOTS[k]||{w:960,q:.8,get:()=>st.covers[k],set:v=>{if(v)st.covers[k]=v;else delete st.covers[k];}};
const fileIn=document.createElement('input');fileIn.type='file';fileIn.accept='image/*';fileIn.hidden=true;fileIn.id='imgFile';document.body.appendChild(fileIn);
const menu=document.createElement('div');menu.id='imgMenu';menu.hidden=true;menu.setAttribute('role','dialog');menu.setAttribute('aria-label','Image');
menu.innerHTML='<button type="button" data-act="upload">Upload image</button><button type="button" data-act="link">Paste image link (GIF)</button><button type="button" data-act="remove">Remove</button><button type="button" data-act="cancel">Cancel</button>';
document.body.appendChild(menu);let target=null;
function put(k,v){const S=slot(k),prev=S.get();S.set(v);if(!save())S.set(prev);paintImages();if(k==='cover'&&window.StudyAccent)StudyAccent.refresh();}
function openMenu(k,anchor){target=k;menu.querySelector('[data-act="remove"]').hidden=!slot(k).get();menu.hidden=false;
 const r=anchor.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(innerWidth-236,r.left))+'px';menu.style.top=Math.min(innerHeight-200,r.bottom+6)+'px';menu.querySelector('button').focus();}
function closeMenu(){menu.hidden=true;}
menu.addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.act;if(!a)return;const k=target;closeMenu();
 if(a==='upload')fileIn.click();
 else if(a==='remove')put(k,null);
 else if(a==='link'){const v=(prompt('Paste an image link: Google Drive (shared: Anyone with the link), Giphy/Tenor, or any direct .gif/.png/.jpg address.')||'').trim();if(!v)return;
  const urls=imageCandidates(v);
  if(!urls.length){alert('That link cannot be used. It must start with https:// and contain no spaces or quotes.');return;}
  tryLoad(urls,u=>put(k,u),()=>alert(driveId(v)?'Could not load the image from Google Drive. In Drive, set sharing to "Anyone with the link", then copy the link again.':'Could not load an image from that link. Use the direct image address.'));}});
document.addEventListener('click',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!e.target.closest('[data-img]'))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
fileIn.onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!target)return;const k=target,S=slot(k);pickImage(f,S.w,S.q,d=>put(k,d),S.alpha);};
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-img]');if(!b)return;e.stopPropagation();openMenu(b.dataset.img,b);});
/* ---------- pomodoro ----------
   The timer keeps running when you leave Today: its end time is kept in studyos.pomo.v1 (a screen setting, not study data,
   not backed up), and the nav shows a small countdown on every other page. */
const POMO_KEY='studyos.pomo.v1';
let mins=25,left=25*60,endAt=0,tick=null,psub='';
/* background sound while the timer runs: generated in the browser (no download); choice kept on this device (studyos.pomosound.v1, not backed up) */
const Sound=(()=>{let ctx=null,src=null;
 function noise(kind){const sr=ctx.sampleRate,b=ctx.createBuffer(1,sr*4,sr),d=b.getChannelData(0);let last=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+0.02*w)/1.02;d[i]=last*3.5;}else d[i]=w;}return b;}
 function stop(){try{if(src)src.stop();}catch{}src=null;}
 function start(kind){stop();if(!kind||kind==='off')return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();if(ctx.resume)ctx.resume();
  src=ctx.createBufferSource();src.buffer=noise(kind==='brown'?'brown':'white');src.loop=true;let node=src;
  if(kind==='rain'){const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=350;node.connect(lp);lp.connect(hp);node=hp;}
  const g=ctx.createGain();g.gain.value=kind==='white'?0.04:kind==='rain'?0.18:0.12;node.connect(g);g.connect(ctx.destination);src.start();}catch{}}

const SOUND_KEY='studyos.pomosound.v1';
function soundPick(){try{const v=localStorage.getItem(SOUND_KEY);return ['rain','white','brown'].includes(v)?v:'off';}catch{return 'off';}}
const clock=$('#clock'),fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function savePomo(){try{localStorage.setItem(POMO_KEY,JSON.stringify(endAt?{mins,endAt,sub:psub}:{mins,left,sub:psub}));}catch{}}
function showClock(){clock.textContent=fmt(Math.max(0,left));document.title=(endAt?fmt(Math.max(0,left))+' · ':'')+'Today — Study OS';}
function stop(){clearInterval(tick);tick=null;endAt=0;$('#pStart').textContent='start';Sound.stop();}
/* Pomodoro history for Stats: minutes of finished 25-minute sessions per day (studyos.pomolog.v1, backed up). lastEnd stops double counting. */
const POMOLOG='studyos.pomolog.v1';
function logPomo(end,m,sub){if(m!==25||!end)return;try{const o=JSON.parse(read(POMOLOG)||'{}')||{};if(o.lastEnd===end)return;const d=T.dayKey(end);o.days=o.days&&typeof o.days==='object'?o.days:{};o.days[d]=(+o.days[d]||0)+m;
 if(sub){o.bySub=o.bySub&&typeof o.bySub==='object'?o.bySub:{};const b=o.bySub[d]&&typeof o.bySub[d]==='object'?o.bySub[d]:{};b[sub]=(+b[sub]||0)+m;o.bySub[d]=b;}o.lastEnd=end;localStorage.setItem(POMOLOG,JSON.stringify(o));window.StudyCloud&&StudyCloud.dirty();}catch{}}
function step(){left=Math.ceil((endAt-Date.now())/1000);if(left<=0){const m=mins;logPomo(endAt,m,psub);if(m===25&&window.StudyTodayX)StudyTodayX.sessionDone(psub,endAt);left=0;stop();savePomo();showClock();try{navigator.vibrate&&navigator.vibrate(300);}catch{}window.StudyNav&&StudyNav.timesUp&&StudyNav.timesUp(m);return;}showClock();}
function run(){tick=setInterval(step,500);$('#pStart').textContent='pause';if(mins===25)Sound.start(soundPick());else if(window.StudyTodayX)StudyTodayX.breakStarted();step();}
$('#pStart').onclick=()=>{if(tick){left=Math.max(0,Math.ceil((endAt-Date.now())/1000));stop();savePomo();showClock();$('#pStart').textContent='resume';return;}
 if(left<=0)left=mins*60;endAt=Date.now()+left*1000;savePomo();run();};
function setMode(m){stop();mins=m;left=m*60;savePomo();showClock();paintTabs();}
function paintTabs(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.m===mins)));}
$('#pReset').onclick=()=>setMode(mins);
$('#pSub').onchange=()=>{psub=$('#pSub').value;savePomo();};
$('#pSound').value=soundPick();$('#pSound').onchange=()=>{const v=$('#pSound').value;try{localStorage.setItem(SOUND_KEY,v);}catch{}if(tick&&mins===25)Sound.start(v);else Sound.stop();};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
/* pick the timer up where it was */
(function(){let s=null;try{s=JSON.parse(localStorage.getItem(POMO_KEY)||'null');}catch{}
 if(!s||![5,15,25].includes(s.mins))return;mins=s.mins;paintTabs();if(typeof s.sub==='string'&&$('#pSub').querySelector('option[value="'+s.sub+'"]')){psub=s.sub;$('#pSub').value=psub;}
 if(s.endAt&&s.endAt>Date.now()){endAt=s.endAt;run();}
 else if(s.endAt){logPomo(s.endAt,mins,psub);left=0;showClock();savePomo();}
 else if(Number.isFinite(s.left)&&s.left>=0&&s.left<=mins*60){left=s.left;showClock();if(left&&left<mins*60)$('#pStart').textContent='resume';}})();
/* ---------- data ---------- */
let data={},summaries={},langData={},langSum={},loadFailed=0,now=Date.now(),today=T.dayKey(now);
const link=(c,tab,cat)=>c.page+'?tab='+tab+(cat?'&cat='+encodeURIComponent(cat):'');
function leftLabel(iso){const d=T.daysUntil(iso,now);return d<0?{t:(-d)+'d late',c:'late'}:d===0?{t:'Today',c:'today'}:{t:d+'d left',c:''};}
const PRI={High:0,Medium:1,Low:2};
function upcoming(){return settings.exams.map(e=>({...e,d:T.daysUntil(e.date,now)})).filter(e=>e.d>=0).sort((a,b)=>a.d-b.d||a.date.localeCompare(b.date));}

function nextClass(){

  const f=typeof File==='function'?new File([json],name,{type:'application/json'}):null;
  if(touch&&f&&navigator.canShare&&navigator.canShare({files:[f]})){
   navigator.share({files:[f],title:'Study OS backup'}).then(()=>bkDone('share'),err=>{
    if(err&&err.name==='AbortError')bkSay('Cancelled. No backup was saved.',false);else download(json,name);});
   return;
  }
 }catch(err){}
 download(json,name);
}
function download(json,name){
 try{const url=URL.createObjectURL(new Blob([json],{type:'application/json;charset=utf-8'})),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);bkDone('download');}
 catch(err){bkSay('Could not save the file here. Open the Backup page instead.',false);}
}
/* ---------- Continue where I left off (studyos.last.v1, written by the course and textbook pages) + countdown ---------- */
function ago(t){const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago';}
function renderContinue(){
 const el=$('#continue');if(!el)return;
 const L=window.StudyLast&&StudyLast.get();
 if(!L||Date.now()-L.t>21*864e5){el.hidden=true;return;}
 const ex=upcoming(),mine=ex.find(e=>e.course===L.course),ne=mine||ex[0];
 el.href=L.href;el.hidden=false;
 el.setAttribute('aria-label','Continue: '+L.title+(L.sub?', '+L.sub:'')+(ne?'. '+ne.title+(ne.d===0?' is today':' in '+ne.d+' day'+(ne.d===1?'':'s')):''));
 el.innerHTML='<span class="ct"><span class="k">Continue</span><b>'+esc(L.title)+'</b>'+(L.sub?'<span class="q">'+esc(L.sub)+'</span>':'')+'<span class="w">'+esc(ago(L.t))+' →</span></span>'
  +(ne?'<span class="cd'+(ne.d<=3?' hot':'')+'" aria-hidden="true"><span class="n">'+(ne.d===0?'Today':ne.d)+'</span><span class="l">'+(ne.d===0?'':ne.d===1?'day to ':'days to ')+esc(ne.title)+'</span></span>':'');
}
/* ---------- WordNest daily goal: answers today vs the WordNest goal, and words due (EN + 中文) ---------- */
function renderWordGoal(){
 const el=$('#wordGoal');if(!el)return;
 const g=window.StudyWordNest&&StudyWordNest.read();
 if(!g||!g.started){el.hidden=true;return;}
 const pct=Math.min(100,Math.round(g.done/g.goal*100)),left=Math.max(0,g.goal-g.done);
 el.hidden=false;el.classList.toggle('met',g.met);
 el.href=g.dueZh>g.dueEn?'vocabloom/?lang=zh':'vocabloom/?lang=en';
 const parts=[];if(g.dueEn)parts.push(g.dueEn+' English');if(g.dueZh)parts.push(g.dueZh+' Chinese');
 el.setAttribute('aria-label','WordNest: '+g.done+' of '+g.goal+' words reviewed today'+(g.met?', goal met':'')+(g.streak?', '+g.streak+'-day streak':'')+'. '+g.due+' words due.');
 el.innerHTML='<span class="wt"><span class="k">WordNest'+(g.met?' · goal met':' · daily goal')+(g.streak?' · '+g.streak+'-day streak':'')+'</span><b>'+g.done+' / '+g.goal+' words today</b>'
  +'<span class="q">'+(g.met?'Done for today. Extra reviews still help.':left+' more to reach your goal.')+(parts.length?' Due now: '+esc(parts.join(' · '))+'.':' Nothing due.')+'</span>'
  +'<span class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></span></span>'
  +'<span class="wdue" aria-hidden="true"><span class="n">'+g.due+'</span><span class="l">due '+(g.due===1?'word':'words')+' →</span></span>';
}
/* ---------- + New word: adds to WordNest My words (vocabloom_mvp_v1.custom, same shape as WordNest's own Add word) ---------- */
(function(){
 const WN_KEY='vocabloom_mvp_v1',dlg=$('#wordAddDlg'),btn=$('#wordAdd');if(!dlg||!btn)return;
 const msg=t=>{$('#waMsg').textContent=t;};
 btn.onclick=()=>{$('#wordAddForm').reset();msg('');if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');$('#waEn').focus();};
 $('#waCancel').onclick=()=>dlg.close();
 $('#wordAddForm').onsubmit=e=>{
  e.preventDefault();
  const en=$('#waEn').value.trim().toLowerCase(),th=$('#waTh').value.trim(),ex=$('#waEx').value.trim();
  if(!en||!th){msg('Type the word and its meaning.');return;}
  let v={};try{v=JSON.parse(read(WN_KEY)||'{}')||{};}catch(err){msg('WordNest data could not be read here; add the word inside WordNest.');return;}
  if(!v||typeof v!=='object'||Array.isArray(v)){msg('WordNest data could not be read here; add the word inside WordNest.');return;}
  const custom=Array.isArray(v.custom)?v.custom:[];
  if(custom.some(w=>w&&String(w.en).toLowerCase()===en)){msg('“'+en+'” is already in My words.');return;}
  const t=Date.now();
  v.custom=custom.concat([{id:'custom-'+t+'-'+Math.random().toString(36).slice(2,7),en,th,example:ex||en,emoji:'💡',category:'personal',level:'B1',syncTs:t}]);
  try{localStorage.setItem(WN_KEY,JSON.stringify(v));}catch(err){msg('Could not save on this device.');return;}
  msg('Added “'+en+'”. Open WordNest once to sync it to your other devices.');
  $('#wordAddForm').reset();setTimeout(()=>dlg.close(),1200);
 };
})();
/* ---------- practice goal: questions answered today (any subject) vs the owner's goal, saved as qgoal in studyos.home.v1 ---------- */
function renderPracticeGoal(){
 const el=$('#qGoal'),M=window.StudyMotivation;if(!el||!M||!window.StudyStats)return;
 const per=StudyStats.answersPerDay(T.COURSES.map(c=>read('study-'+c.key))),now=Date.now(),today=M.dayKey(now),done=per[today]||0,g=M.goal(st.qgoal),met=done>=g,streak=M.goalStreak(per,g,now);
 const pct=Math.min(100,Math.round(done/g*100));
 el.hidden=false;el.classList.toggle('met',met);
 el.innerHTML='<span class="wt"><span class="k">Practice'+(met?' · goal met':' · daily goal')+(streak?' · '+streak+'-day streak':'')+'</span><b>'+done+' / '+g+' questions today</b>'
  +'<span class="q">'+(met?'Goal met. Every extra question still helps.':(g-done)+' more to reach your goal.')+'</span><span class="bar" role="img" aria-label="'+done+' of '+g+' questions"><i style="width:'+pct+'%"></i></span></span>'
  +'<span class="qgo"><a href="practice.html">Practice →</a><button type="button" id="qGoalSet" aria-label="Daily goal: '+g+' questions. Change">Goal: '+g+'</button></span>';
 $('#qGoalSet').onclick=()=>{st.qgoal=M.nextGoal(g);save();renderPracticeGoal();};
}
function renderAll(){settings=T.loadSettings(read(T.SETTINGS_KEY));renderBackupNudge();renderContinue();renderPracticeGoal();renderWordGoal();renderChips();renderClasses();renderPlan();renderExams();renderTasks();renderSubjects();}
renderAll();
Promise.all(T.COURSES.map(c=>fetch(c.data,{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text();}).then(h=>{data[c.key]=T.parseCourseData(h);}).catch(()=>{loadFailed++;}))).then(()=>{compute();renderAll();});
Promise.all(T.LANGS.map(l=>fetch(l.data,{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text();}).then(h=>{langData[l.key]=T.parseCourseData(h);}).catch(()=>{}))).then(()=>{compute();renderSubjects();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){compute();renderAll();}});
addEventListener('studycloud:applied',()=>{st=load();st.tasks=Array.isArray(st.tasks)?st.tasks:[];st.covers=st.covers&&typeof st.covers==='object'&&!Array.isArray(st.covers)?st.covers:{};paintImages();compute();renderAll();});
paintImages();
})();
