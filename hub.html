<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@500;700&amp;family=Zen+Maru+Gothic:wght@500;700;900&amp;family=Mali:wght@500;600;700&amp;display=swap">
<meta name="description" content="Study OS — subjects and chapters">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study OS">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)">
<title>Hub — Study OS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans','IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;line-height:1.55}
.container{max-width:1040px;margin:auto;padding:clamp(18px,4vw,40px) max(18px,env(safe-area-inset-right)) 60px max(18px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.brand,h1,h2,h3,.big,.nums b,.acts a,.go{font-family:'Outfit','DM Sans','IBM Plex Sans Thai',system-ui,sans-serif}
.brand{font-weight:800;font-size:21px;letter-spacing:-.6px;color:var(--text);text-decoration:none}.brand span{color:var(--purple)}
.top-link{color:var(--purple);background:var(--lav);font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:8px 14px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.hero{padding:max(14px,env(safe-area-inset-top)) 0 8px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);font-weight:800;margin:0 0 6px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.2;margin:0 0 6px;letter-spacing:-.5px}
.lead{color:var(--muted);margin:0}
h2{font-size:20px;margin:30px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-family:'DM Sans',"IBM Plex Sans Thai",system-ui,sans-serif;font-size:13px;font-weight:500;color:var(--muted)}
.card{background:var(--white);border:1px solid transparent;border-radius:16px;box-shadow:var(--shadow);padding:18px 20px}
.countdown{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;align-items:center;margin-top:20px}
.big{font-size:clamp(44px,9vw,64px);font-weight:800;line-height:1;color:var(--purple);grid-row:span 2;min-width:2ch;text-align:center}
.big small{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-top:6px}
.cd-title{font-size:19px;font-weight:700;margin:0}.cd-sub{color:var(--muted);margin:0;font-size:14px}
.others{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--white);color:var(--muted)}
.pill b{color:var(--text)}
.warn{display:inline-block;font-size:12px;font-weight:700;color:var(--orange);background:var(--orangebg);border-radius:6px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.task{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.task input{width:28px;height:28px;margin:1px 0 0;accent-color:var(--purple)}
.task h3{font-size:16px;margin:0;line-height:1.4}.task p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.task .tag{font-size:12px;font-weight:700;color:var(--purple);background:var(--lav);border-radius:6px;padding:1px 8px;margin-right:6px}
.task.done h3,.task.done p{text-decoration:line-through;opacity:.6}
.go{font-size:14px;font-weight:700;color:var(--purple);text-decoration:none;white-space:nowrap;padding:4px 0;display:inline-flex;align-items:center;min-height:44px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.acts a{font-size:13px;font-weight:500;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;text-decoration:none}
.acts a.main{background:var(--purple);color:#fff;border-color:var(--purple)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.course h3{font-size:17px;margin:0 0 10px}
.nums{display:flex;gap:18px;margin-bottom:12px}.nums div{font-size:13px;color:var(--muted)}.nums b{display:block;font-size:24px;font-family:'Outfit',system-ui,sans-serif;color:var(--text);line-height:1.2}
.nums .due b{color:var(--red)}.nums .new b{color:var(--purple)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.small{font-size:13px;color:var(--muted);margin:6px 0 10px}
.weak{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.weak li{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:15px}
.badge{font-weight:700;font-size:13px;border-radius:6px;padding:2px 9px;background:var(--redbg);color:var(--red);white-space:nowrap}
.empty{color:var(--muted);font-size:14px;margin:0}
details.exam{border-top:1px solid var(--line);padding:10px 0}details.exam:first-of-type{border-top:0}
details.exam summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;list-style:none;font-weight:600}
details.exam summary::-webkit-details-marker{display:none}
.edit{display:grid;gap:10px;padding:12px 0 4px}
.edit label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.edit input[type=text],.edit input[type=date],.edit select{font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:40px}
.row{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-size:14px;font-weight:700;border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer;border:1px solid var(--line);background:var(--white);color:var(--purple)}
button.primary{background:var(--purple);color:var(--white);border-color:var(--purple)}
button.danger{color:var(--red)}
.note{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.status{font-size:14px;color:var(--muted)}.status.err{color:var(--red)}
@media(max-width:760px){.grid3{grid-template-columns:1fr}}

.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted);margin:22px 0 0}
.crumb[hidden]{display:none}
.crumb a{color:var(--purple);font-weight:700;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.subj{display:block;text-decoration:none;color:inherit}
.subj h3{margin:0 0 4px;font-size:18px}.subj .full{margin:0 0 12px;font-size:13px;color:var(--muted)}
.subj .go{padding:0}
.chap{display:grid;gap:8px}
.chap h3{margin:0;font-size:16px;line-height:1.4}
.chap .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.chap .meta b{color:var(--text)}.chap .meta .due b{color:var(--red)}
.tagx{font-size:12px;font-weight:700;color:var(--orange);background:var(--orangebg);border-radius:6px;padding:1px 8px}
.list{display:grid;gap:12px;margin-top:14px}
.notebtn{font:500 13px 'IBM Plex Mono',monospace;font-family:inherit;border:1px dashed var(--line);background:var(--bg);color:var(--muted);border-radius:10px;padding:0 14px;min-height:44px;cursor:pointer}
.notebtn.has{border-style:solid;color:var(--text)}
.notebox textarea{width:100%;min-height:180px;resize:vertical;font:15px/1.6 inherit;font-family:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.notebox textarea:focus{outline:2px solid var(--purple);outline-offset:1px}
.notemeta{font-size:12px;color:var(--muted);margin:4px 0 0;min-height:16px}
</style>
<link rel="stylesheet" href="assets/study-world.css?v=8">
<script src="scripts/study-theme.js?v=5"></script>
<script src="scripts/study-accent.js?v=2"></script>
</head>
<body>
<div class="container">
<main>
<section class="hero">
<h1 id="title">Lessons</h1>
<p class="lead" id="lead" hidden></p>
</section>
<nav class="crumb" id="crumb" aria-label="Breadcrumb" hidden><a href="#">← Lessons</a></nav>
<section class="lead-panel" id="nextStep" aria-label="Next step" hidden></section>
<h2 id="secTitle">Subjects</h2>
<div id="view" class="list"><p class="status">Loading…</p></div>
</main>
</div>
<script src="scripts/study-today.js?v=2"></script>
<script src="scripts/study-cloud.js?v=3"></script>
<script src="scripts/study-nav.js?v=6"></script>
<script>
(function(){
'use strict';
const T=window.StudyToday,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function read(key){try{return localStorage.getItem(key);}catch{return null;}}
const settings=T.loadSettings(read(T.SETTINGS_KEY));
let data={},summaries={},errors=[];
function compute(){const now=Date.now();summaries={};for(const c of T.COURSES){if(data[c.key])summaries[c.key]=T.summarize(data[c.key],read(c.mark+'-srs'),read('study-'+c.key),now);}return now;}
function link(c,tab,cat){return c.page+'?tab='+tab+(cat?'&cat='+encodeURIComponent(cat):'');}
function examFor(courseKey,catId,now){
 return settings.exams.filter(e=>e.course===courseKey&&e.cats.includes(catId)).map(e=>({...e,days:T.daysUntil(e.date,now)})).filter(e=>e.days>=0).sort((a,b)=>a.days-b.days)[0]||null;
}
function subjects(now){
 $('#title').textContent='Lessons';$('#crumb').hidden=true;$('#secTitle').hidden=false;
 const wideKey=(settings.exams.map(e=>({...e,d:T.daysUntil(e.date,now)})).filter(e=>e.d>=0).sort((a,b)=>a.d-b.d)[0]||{}).course||'';
 {const ne=settings.exams.map(e=>({...e,d:T.daysUntil(e.date,now)})).filter(e=>e.d>=0).sort((a,b)=>a.d-b.d)[0],c=ne&&T.COURSES.find(x=>x.key===ne.course),box=$('#nextStep');
  if(c){const sc=(ne.cats||[]).length?' · scope: '+ne.cats.map(x=>x.replace(/^c/,'Ch')).join(', '):'';box.hidden=false;const chs=(ne.cats||[]).map(x=>x.replace(/^c/,'Ch'));const verb=document.documentElement.classList.contains('focus')?'Practise ':'Read ';box.innerHTML='<div class="bub"><b>'+(chs.length?verb+esc(chs.slice(0,3).join(' + '))+(chs.length>3?' …':''):verb+esc(c.name))+'</b><span>'+esc(ne.title)+(ne.d===0?' today':' in '+ne.d+(ne.d===1?' day':' days'))+'</span></div><a class="go" href="#'+c.key+'">Open '+esc(c.name)+'</a>';}else box.hidden=true;}
 const cards=T.COURSES.map(c=>{
  const s=summaries[c.key];
  if(!s)return '<div class="card subj"><h3>'+esc(c.name)+'</h3><p class="full">'+esc(c.full)+'</p><p class="empty">'+(errors.includes(c.key)?'Could not load':'Loading…')+'</p></div>';
  const pct=s.total?Math.round(s.seen/s.total*100):0,chapters=Object.keys(s.per).length;
  return '<a class="card subj t-'+c.key+(c.key===wideKey?' wide':'')+'" href="#'+c.key+'" aria-label="Open '+esc(c.name)+'"><h3><span class="jersey sm" aria-hidden="true">'+esc(c.full)+'</span>'+esc(c.name)+'</h3><p class="full">'+chapters+' chapters</p>'+(document.documentElement.classList.contains('focus')?(()=>{let q=0,a=0,r=0;for(const x of Object.values(s.per)){q+=x.quiz;a+=x.answered;r+=x.correct;}const qp=q?Math.round(a/q*100):0;return '<div class="nums"><div><b>'+a+'</b>done</div><div class="new"><b>'+(a?Math.round(r/a*100):0)+'%</b>correct</div></div><div class="bar" aria-hidden="true"><i style="width:'+qp+'%"></i></div>';})():'<div class="nums"><div class="'+(s.reviewNow?'due':'')+'"><b>'+s.reviewNow+'</b>due</div><div class="new"><b>'+pct+'%</b>seen</div></div><div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div>')+'<span class="go">Lessons →</span></a>';
 });
 cards.push('<a class="card subj strip t-eng" href="vocabloom/index.html?lang=en"><h3><span class="jersey sm" aria-hidden="true">EN</span>English</h3><p class="full">WordNest</p><span class="go">Open →</span></a>');
 cards.push('<a class="card subj strip t-zh" href="vocabloom/index.html?lang=zh"><h3><span class="jersey sm" aria-hidden="true">ZH</span>Chinese</h3><p class="full">WordNest</p><span class="go">Open →</span></a>');
 $('#view').className='grid3';$('#view').innerHTML=cards.join('');
}
function chapters(c,now){
 const D=data[c.key],s=summaries[c.key];
 $('#title').textContent=c.name;$('#crumb').hidden=false;$('#secTitle').hidden=true;$('#nextStep').hidden=true;
 if(!D||!s){$('#view').className='list';$('#view').innerHTML='<p class="status'+(errors.includes(c.key)?' err':'')+'">'+(errors.includes(c.key)?'Could not load':'Loading…')+'</p>';return;}
 const rows=D.cats.map(([id,label])=>{
  const p=s.per[id],ex=examFor(c.key,id,now),acc=T.accuracy(p);
  const book=c.key==='acc'&&/^c\d+$/.test(id)?'<a href="accounting-textbook.html?ch='+id.slice(1)+'">Textbook</a>':'';
  return '<div class="card chap"><h3>'+esc(label)+(ex?' <span class="tagx">'+esc(ex.title)+' · '+(ex.days===0?'today':ex.days+'d')+'</span>':'')+'</h3>'
   +'<div class="meta">'+(document.documentElement.classList.contains('focus')?'':'<span class="due">Due <b>'+p.due+'</b></span><span>Cards <b>'+p.seen+'/'+p.cards+'</b></span>')+'<span>Quiz <b>'+(p.quiz?(p.answered?Math.round(acc*100)+'%':'–'):'–')+'</b></span></div>'
   +'<div class="acts">'+(document.documentElement.classList.contains('focus')?'<a class="main" href="'+link(c,'prac',id)+'">Practice</a>':'<a class="main" href="'+link(c,'sum',id)+'">Lesson</a><a href="'+link(c,'cards',id)+'">Cards</a><a href="'+link(c,'prac',id)+'">Practice</a>')+book+noteBtn(c.key+':'+id)+'</div>'+noteBox(c.key+':'+id)+'</div>';
 });
 rows.unshift('<div class="card chap"><h3>General notes</h3><div class="acts">'+noteBtn(c.key+':general')+'</div>'+noteBox(c.key+':general')+'</div>');
 $('#view').className='list';$('#view').innerHTML=rows.join('');
}
/* ---------- notes (this browser; backed up) ---------- */
const NOTES_KEY='studyos.notes.v1';let notes={},openNote=null;
try{const o=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}');if(o&&typeof o==='object'&&!Array.isArray(o))notes=o;}catch{}
const noteText=k=>notes[k]&&typeof notes[k].text==='string'?notes[k].text:'';
function noteBtn(k){const has=noteText(k).trim();return '<button type="button" class="notebtn'+(has?' has':'')+'" data-note="'+esc(k)+'" aria-expanded="'+(openNote===k)+'">'+(has?'Edit notes':'+ Notes')+'</button>';}
function noteBox(k){if(openNote!==k)return '';const n=notes[k];return '<div class="notebox"><textarea data-note-text="'+esc(k)+'" maxlength="20000" placeholder="Write notes for this chapter…" aria-label="Notes">'+esc(noteText(k))+'</textarea><p class="notemeta" data-note-meta="'+esc(k)+'">'+(n&&n.updated?'Saved '+new Date(n.updated).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'')+'</p></div>';}
let noteTimer=null;
function saveNote(k,text){try{const o=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}');if(o&&typeof o==='object'&&!Array.isArray(o))notes=o;}catch{}
 if(text.trim())notes[k]={text:text.slice(0,20000),updated:new Date().toISOString()};else delete notes[k];
 let ok=true;try{localStorage.setItem(NOTES_KEY,JSON.stringify(notes));window.StudyCloud&&StudyCloud.dirty();}catch{ok=false;}
 const m=document.querySelector('[data-note-meta="'+CSS.escape(k)+'"]');if(m)m.textContent=ok?(text.trim()?'Saved':'Empty note removed'):'Could not save (storage full)';}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-note]');if(!b)return;openNote=openNote===b.dataset.note?null:b.dataset.note;render();const t=document.querySelector('[data-note-text="'+CSS.escape(b.dataset.note)+'"]');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.noteText;if(!k)return;clearTimeout(noteTimer);const v=e.target.value;noteTimer=setTimeout(()=>saveNote(k,v),400);});
document.addEventListener('focusout',e=>{const k=e.target.dataset&&e.target.dataset.noteText;if(k){clearTimeout(noteTimer);saveNote(k,e.target.value);}});
function render(){
 const now=compute(),key=(location.hash||'').slice(1),c=T.COURSES.find(x=>x.key===key);
 document.title=(c?c.name+' — ':'')+'Lessons — Study OS';
 c?chapters(c,now):subjects(now);
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});
addEventListener('studycloud:applied',()=>{if(noteTimer)return;try{const o=JSON.parse(localStorage.getItem(NOTES_KEY)||'{}');if(o&&typeof o==='object'&&!Array.isArray(o))notes=o;}catch{}render();});
render();
Promise.all(T.COURSES.map(c=>fetch(c.page,{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text();})
 .then(html=>{data[c.key]=T.parseCourseData(html);}).catch(()=>{errors.push(c.key);}))).then(render);
})();
</script>
</body>
</html>
