function resetAnswerCheck(){
 const api=window.StudyAccountingCheck,ready=!!(current&&api?.supports(current.id));
 $('checkAnswer').disabled=!ready;$('showAnswer').disabled=!ready;$('checkFeedback').hidden=true;$('checkFeedback').replaceChildren();$('checkFeedback').removeAttribute('data-result');
 $('checkScope').textContent=!current?'Select a question to check.':!api?'Answer checker could not load. Reload this page to retry; your saved answers are unchanged.':ready?'Checks the final answer only, e.g. '+api.describe(current.id).example+'. To keep your working, add a last line: Final answer: '+api.describe(current.id).example+'. Reasoning is not graded; completion status stays under your control.':'No reviewed answer is available for this question yet. Current coverage: '+api.count+' of '+records.length+' questions ('+api.ids.join(', ')+'). Your answer can still be saved and reviewed manually.';
}
function checkCurrentAnswer(reveal=false){
 if(!current||!window.StudyAccountingCheck)return;
 flushNotes();const result=reveal?window.StudyAccountingCheck.solution(current.id):window.StudyAccountingCheck.check(current.id,$('answer').value),box=$('checkFeedback');box.replaceChildren();box.dataset.result=result.status;
 const title=document.createElement('strong');title.textContent=result.message;box.append(title);
 for(const text of [result.explanation,result.source])if(text){const p=document.createElement('p');p.textContent=text;box.append(p);}
 box.hidden=false;
}
$('checkAnswer').addEventListener('click',()=>checkCurrentAnswer());
$('showAnswer').addEventListener('click',()=>checkCurrentAnswer(true));
$('answer').addEventListener('input',resetAnswerCheck);
function openQuestion(id){const q=records.find(x=>x.id===id);if(!q)return;flushNotes();if($('search').value.trim()){$('chapter').value=q.chapter;$('kind').value='all';}current=q;try{localStorage.setItem(LAST_KEY,id);}catch{}fullPage=false;extraPage=false;renderVersion++;$('questionCode').textContent=q.id+' · '+q.type;$('questionTitle').textContent=q.title.replace(/\s+[A-Z][!"#$%&'()]+$/,'');$('questionSub').textContent=chapterLabel(q.chapter);$('answer').value=progress[q.id]?.notes||'';$('questionStatus').value=statusOf(q.id);$('saveStatus').textContent='Saved locally';const all=available(),at=all.findIndex(x=>x.id===id);$('questionProgress').textContent=at>=0?`Question ${at+1} / ${all.length}`:`PDF page ${q.pdfPage}`;
resetAnswerCheck();$('surrounding').textContent='Show full page';$('extraPage').hidden=true;for(const id of ['previousTop','previousBottom'])$(id).disabled=at<=0;for(const id of ['nextTop','nextBottom'])$(id).disabled=at<0||at>=all.length-1;renderList();paint();}
function filteredChanged(){const all=available();if(!all.length){flushNotes();current=null;resetAnswerCheck();$('answer').value='';$('questionStatus').value='new';for(const id of ['previousTop','previousBottom','nextTop','nextBottom'])$(id).disabled=true;$('questionCode').textContent='NO MATCHES';$('questionTitle').textContent='No questions found';$('questionSub').textContent='Try another chapter, type or search term.';$('questionProgress').textContent='';$('viewer').replaceChildren();renderList();return;}
if(current&&all.some(q=>q.id===current.id)){openQuestion(current.id);}else openQuestion(all[0].id);}
function navigate(delta){const all=available();let i=all.findIndex(x=>x.id===current?.id);const next=all[i+delta];if(next){openQuestion(next.id);if(window.innerWidth<=850)document.getElementById('workspace').scrollIntoView({behavior:'smooth',block:'start'});}}
function flushNotes(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;}if(!current)return;const value=$('answer').value;const old=progress[current.id]||{};if(value===String(old.notes||'')){if(progressDirty&&persist())$('saveStatus').textContent='Saved on this device';return;}progress[current.id]={...old,notes:value,updated:new Date().toISOString()};if(persist())$('saveStatus').textContent='Saved on this device';}
function openDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB is unavailable'));const r=indexedDB.open(IDB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Database unavailable'));});}
async function bookGet(){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).get('pdf');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();});}
async function bookPut(blob){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(blob,'pdf');tx.oncomplete=()=>{db.close();resolve();};tx.onerror=()=>{db.close();reject(tx.error)};});}
async function bookDelete(){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete('pdf');tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};});}
async function loadPdf(blob,save){if(!window.pdfjsLib)throw new Error('PDF reader could not load. Connect to the internet once, then reload this page.');setPdfState('Opening PDF…',false);$('renderStatus').textContent='Opening textbook…';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const buffer=await blob.arrayBuffer();if(buffer.byteLength<10000)throw new Error('The selected file is not a valid textbook PDF.');const task=pdfjsLib.getDocument({data:new Uint8Array(buffer),isEvalSupported:false});const opened=await task.promise;if(opened.numPages!==1210){await opened.destroy();throw new Error(`This PDF has ${opened.numPages} pages; the textbook index expects 1,210 pages. Choose the original Acc textbook.pdf.`);}
const previous=pdfDoc;pdfDoc=opened;sourceBlob=blob;pdfBytes=null;pageCache.clear();if(previous)previous.destroy().catch(()=>{});if(save){try{await bookPut(blob);$('fileHint').textContent='Original questions available inside Study OS. Your PDF is saved privately in this browser.';}catch(e){$('fileHint').textContent='PDF is ready for this session, but Safari did not allow saving it for next time. You can choose it again later.';}}
else $('fileHint').textContent='Original questions are loaded privately from this browser.';setPdfState('Ready · 1,210 pages',true);error('');paint();}
async function importPdf(){const file=$('pdfFile').files?.[0];$('pdfFile').value='';if(!file)return;try{if(!file.name.toLowerCase().endsWith('.pdf')&&file.type!=='application/pdf')throw new Error('Please select a PDF file.');await loadPdf(file,true);}catch(e){setPdfState(pdfDoc?'Ready · 1,210 pages':'PDF needed',!!pdfDoc);error(e.message||'Could not open this file.');$('renderStatus').textContent='';}}
function bounds(q){const v=geometry?.items[q.id];return v&&v.page===q.pdfPage?v:{page:q.pdfPage,top:20,bottom:750,fallback:true};}
async function pageCanvas(p,quality=1.6){const key=p+'-'+quality;if(pageCache.has(key))return pageCache.get(key);const page=await pdfDoc.getPage(p);const scale=Math.min(2.4,Math.max(1.5,quality));const viewport=page.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);const ctx=canvas.getContext('2d',{alpha:false});await page.render({canvasContext:ctx,viewport}).promise;pageCache.set(key,canvas);if(pageCache.size>3)pageCache.delete(pageCache.keys().next().value);return canvas;}
async function paint(){const t=++renderVersion;const v=$('viewer');v.replaceChildren();if(!current)return;const geo=bounds(current);$('pageLabel').textContent=`Original question · PDF page ${current.pdfPage}`;$('renderStatus').textContent='';$('extraPage').hidden=true;
if(!pdfDoc){const c=document.createElement('div');c.className='placeholder';const h=document.createElement('h3');h.textContent='Show the real question here';const p=document.createElement('p');p.textContent='Select your textbook once. The question, numbers, tables and diagrams will appear right here, not in a separate PDF tab.';const btn=document.createElement('button');btn.type='button';btn.className='btn primary';btn.textContent='Choose PDF';btn.onclick=()=>$('pdfFile').click();c.append(h,p,btn);v.append(c);return;}
try{$('renderStatus').textContent='Rendering original question…';const chapterEnd=catalog.chapters.find(x=>x.chapter===current.chapter)?.pdfEndPage||410;const requestedPage=extraPage?Math.min(chapterEnd,current.pdfPage+1):current.pdfPage;const page=await pdfDoc.getPage(requestedPage);const W=page.view[2]-page.view[0],H=page.view[3]-page.view[1];const quality=window.innerWidth<600?2.05:1.9;const image=await pageCanvas(requestedPage,quality);if(t!==renderVersion)return;
const clip=fullPage||extraPage?{x:10,y:12,w:W-20,h:H-24}:{x:30,y:Math.max(20,geo.top),w:W-60,h:Math.min(H-15,Math.max(geo.top+70,geo.bottom))-Math.max(20,geo.top)};
const sx=image.width/W,sy=image.height/H;const canvas=document.createElement('canvas');canvas.width=Math.max(10,Math.round(clip.w*sx));canvas.height=Math.max(10,Math.round(clip.h*sy));const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,clip.x*sx,clip.y*sy,clip.w*sx,clip.h*sy,0,0,canvas.width,canvas.height);canvas.setAttribute('role','img');canvas.setAttribute('aria-label',`Original textbook printed question ${current.id} from PDF page ${requestedPage}`);v.replaceChildren(canvas);$('renderStatus').textContent='Original print · not OCR';$('surrounding').textContent=fullPage?'Show only this question':'Show full page';$('extraPage').hidden=extraPage||requestedPage>=chapterEnd;$('extraPage').textContent='Question continues? Show next PDF page';$('pageLabel').textContent=`Original textbook · PDF page ${requestedPage}`;}
catch(e){if(t===renderVersion){$('renderStatus').textContent='Could not render PDF';const p=document.createElement('p');p.className='error';p.textContent=e.message||'Rendering failed';v.replaceChildren(p);}}}
function setStatus(value){if(!current)return;const old=progress[current.id]||{};progress[current.id]={...old,status:value,updated:new Date().toISOString()};persist();syncCounts();renderList();}
function exportProgress(){flushNotes();const blob=new Blob([JSON.stringify({version:1,book:'Fundamental Accounting Principles 24e',exportedAt:new Date().toISOString(),progress},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='studyos-accounting-textbook-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
async function importProgress(){const f=$('progressFile').files?.[0];$('progressFile').value='';if(!f)return;try{if(f.size>8e6)throw new Error('Backup file is too large');const data=JSON.parse(await f.text());if(data.version!==1||data.book!=='Fundamental Accounting Principles 24e'||!data.progress||typeof data.progress!=='object'||Array.isArray(data.progress))throw new Error('Not a matching textbook progress backup');if(!confirm('Replace this textbook\'s saved answers with the imported backup?'))return;const valid=new Set(catalog.items.map(x=>x.id));const next={};for(const [k,v] of Object.entries(data.progress)){if(!valid.has(k)||!v||typeof v!=='object'||Array.isArray(v))continue;next[k]={status:statusValues.has(v.status)?v.status:'new',notes:String(v.notes||'').slice(0,15000),updated:String(v.updated||'')};}const old=progress;progress=next;if(!persist()){progress=old;return;}if(current)openQuestion(current.id);syncCounts();error('');}catch(e){error(e.message||'Could not import backup')}}

$('export').addEventListener('click',exportProgress);$('import').addEventListener('click',()=>$('progressFile').click());$('progressFile').addEventListener('change',importProgress);

(async()=>{try{const [c,g]=await Promise.all([fetch('data/accounting-textbook-index.json',{cache:'no-cache'}),fetch('data/accounting-textbook-geometry.json',{cache:'no-cache'})]);if(!c.ok||!g.ok)throw new Error('Question data could not be loaded.');catalog=await c.json();geometry=await g.json();if(!Array.isArray(catalog.items)||!Array.isArray(catalog.chapters)||!geometry.items)throw new Error('Question data format is invalid');records=catalog.items.filter(x=>!x.sectionOnly&&/^[1-9]$/.test(String(x.chapter)));options();syncCounts();let resumeId='';try{resumeId=localStorage.getItem(LAST_KEY)||'';}catch{}const saved=records.find(x=>x.id===resumeId);if(saved){$('chapter').value=saved.chapter;openQuestion(saved.id);}else filteredChanged();try{const f=await bookGet();if(f)await loadPdf(f,false);}catch(e){error('Saved PDF could not be restored. Choose your PDF again.');} }catch(e){error(e.message||'Could not start this course');$('questionTitle').textContent='Course unavailable';}})();
