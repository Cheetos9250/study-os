name: VocaBloom regression checks

on:
  push:
    paths:
      - "vocabloom/**"
      - "data/cards.json"
      - "data/quiz.json"
      - ".github/workflows/vocabloom-tests.yml"
  pull_request:
    paths:
      - "vocabloom/**"
      - "data/cards.json"
      - "data/quiz.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate VocaBloom and Study OS
        run: node --test vocabloom/tests/regression.test.cjs
