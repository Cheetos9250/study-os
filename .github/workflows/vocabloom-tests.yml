name: VocaBloom regression checks

on:
  push:
    paths:
      - "vocabloom/**"
      - "index.html"
      - "acc.html"
      - "eco.html"
      - "math.html"
      - "eng.html"
      - "zh.html"
      - "data/cards.json"
      - "data/quiz.json"
      - "scripts/sync_notion.py"
      - ".github/workflows/vocabloom-tests.yml"
  pull_request:
    paths:
      - "index.html"
      - "vocabloom/**"
      - "data/cards.json"
      - "data/quiz.json"
      - "scripts/sync_notion.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate VocaBloom and Study OS
        run: node --test vocabloom/tests/*.test.cjs
      - name: Validate Notion exporter data contract
        run: python3 -m unittest discover -s vocabloom/tests -p 'test_*.py'
