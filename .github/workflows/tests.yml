name: Study OS tests
# One place for the full Node + Python regression (it used to run in six
# workflows, so one PR paid for it several times). Runs for any change except
# docs, changelog fragments and plain image files. Browser checks stay in
# their own workflows.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'changelog.d/**'
      - 'docs/**'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.ico'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'changelog.d/**'
      - 'docs/**'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.ico'
  workflow_dispatch:
concurrency:
  group: study-os-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Node regression
        run: node --test tests/*.test.cjs vocabloom/tests/*.test.cjs
      - name: Notion exporter data contract
        run: python3 -m unittest discover -s vocabloom/tests -p 'test_*.py'
      - name: Backup page has no auto-import or external network code
        run: |
          node -e "const fs=require('fs');const x=fs.readFileSync('progress-backup.html','utf8');const j=fs.readFileSync('scripts/study-progress-backup.js','utf8');if(/localStorage\.(?:setItem|removeItem)|fetch\(|XMLHttpRequest|navigator\.sendBeacon/.test(x+j))process.exit(1);if(!x.includes('scripts/study-progress-backup.js'))process.exit(1);"
      - name: Restore is manual and local only
        run: |
          node -e "const fs=require('fs');const x=fs.readFileSync('progress-restore.html','utf8');const j=fs.readFileSync('scripts/study-progress-restore.js','utf8');if(!x.includes('restore.addEventListener(\"click\"'))process.exit(1);if(/fetch\(|XMLHttpRequest|navigator\.sendBeacon|\.submit\(/.test(x+j))process.exit(1);"
