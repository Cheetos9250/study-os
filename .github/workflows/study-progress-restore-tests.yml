name: Study OS missing-only progress restore checks

on:
  push:
    paths:
      - "progress-backup.html"
      - "progress-restore.html"
      - "scripts/study-progress-backup.js"
      - "scripts/study-progress-restore.js"
      - "tests/study-progress-backup.test.cjs"
      - "tests/study-progress-restore.test.cjs"
      - "tests/study-progress-restore-browser.cjs"
      - ".github/workflows/study-progress-restore-tests.yml"
  pull_request:
    paths:
      - "progress-backup.html"
      - "progress-restore.html"
      - "scripts/study-progress-backup.js"
      - "scripts/study-progress-restore.js"
      - "tests/study-progress-backup.test.cjs"
      - "tests/study-progress-restore.test.cjs"
      - "tests/study-progress-restore-browser.cjs"
      - ".github/workflows/study-progress-restore-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test backup and missing-only restore safety
        run: node --test tests/study-progress-backup.test.cjs tests/study-progress-restore.test.cjs
      - name: Check restore is manual and local only
        run: |
          node -e "const fs=require('fs');const x=fs.readFileSync('progress-restore.html','utf8');const j=fs.readFileSync('scripts/study-progress-restore.js','utf8');if(!x.includes('restore.addEventListener(\"click\"'))process.exit(1);if(/fetch\(|XMLHttpRequest|navigator\.sendBeacon|\.submit\(/.test(x+j))process.exit(1);"

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright dependency
        run: npm install --prefix "$RUNNER_TEMP/study-restore-browser" --no-save --ignore-scripts playwright@1.62.1
      - name: Install Chromium and WebKit
        run: '"$RUNNER_TEMP/study-restore-browser/node_modules/.bin/playwright" install --with-deps chromium webkit'
      - name: Exercise synthetic browser backup and restore
        env:
          NODE_PATH: ${{ runner.temp }}/study-restore-browser/node_modules
          QA_OUTPUT: ${{ runner.temp }}/study-restore-qa
        run: node tests/study-progress-restore-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-restore-synthetic-browser-qa
          path: ${{ runner.temp }}/study-restore-qa
          retention-days: 7
