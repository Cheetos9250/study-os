name: Sync Notion to data files

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write
  pages: write

concurrency:
  group: notion-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test synchronization
        run: python3 -m unittest discover -s tests -v

      - name: Pull Verified rows from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_notion.py

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes"
          else
            git config user.name "study-sync"
            git config user.email "study-sync@users.noreply.github.com"
            git add data
            git commit -m "Sync verified data from Notion"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the Pages site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
