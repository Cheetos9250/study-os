name: Sync Notion to draft PR (review required)

# Existing schedule remains, but new questions are never pushed to main.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: notion-data-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # Do not run an unreviewed sync when invoked from a feature branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Verified rows from Notion into the working tree only
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/sync_notion.py

      - name: Propose content changes in a draft PR (no main push or Pages build)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/notion-verified-content
          base: main
          draft: true
          title: "data: review latest Verified Notion learning content"
          body: |
            Automatically generated content proposal from Notion's Verified items.

            Review the new/changed quiz answers and explanations, run the
            safety and content tests, and approve a separate merge.
            **No automatic merge, release, production sync, or Pages build.**

            If this job fails to create a PR, check the repository's
            Settings > Actions > General > Workflow permissions:
            "Allow GitHub Actions to create and approve pull requests".
            Do not bypass that check by pushing directly to main.
          commit-message: "data: propose latest Verified Notion content"
          add-paths: |
            data/cards.json
            data/quiz.json
          delete-branch: false
