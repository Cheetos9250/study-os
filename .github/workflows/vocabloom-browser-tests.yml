name: VocaBloom isolated browser QA (no deployment)

on:
  push:
    paths:
      - 'vocabloom/*.html'
      - 'vocabloom/*.js'
      - 'vocabloom/*.json'
      - 'vocabloom/tests/**'
      - 'data/cards.json'
      - 'data/quiz.json'
      - '.github/workflows/vocabloom-browser-tests.yml'
  pull_request:
    paths:
      - 'vocabloom/*.html'
      - 'vocabloom/*.js'
      - 'vocabloom/*.json'
      - 'vocabloom/tests/**'
      - 'data/cards.json'
      - 'data/quiz.json'
      - '.github/workflows/vocabloom-browser-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test browsers
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Exercise language UI and disposable progress with all services mocked
        run: python vocabloom/tests/browser_smoke.py
