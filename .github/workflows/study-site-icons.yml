name: Study OS site icon checks
on:
  pull_request:
    paths:
      - '*.html'
      - assets/favicon.*
      - assets/apple-touch-icon.png
      - tests/study-site-icons.test.cjs
      - .github/workflows/study-site-icons.yml
  push:
    paths:
      - '*.html'
      - assets/favicon.*
      - assets/apple-touch-icon.png
      - tests/study-site-icons.test.cjs
      - .github/workflows/study-site-icons.yml
permissions:
  contents: read
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs vocabloom/tests/*.test.cjs
