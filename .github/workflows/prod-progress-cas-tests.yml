name: Production CAS candidate OFFLINE tests (NO DEPLOY)

on:
  push:
    branches: [main]
    paths:
      - "experiments/prod-progress-cas/**"
      - ".github/workflows/prod-progress-cas-tests.yml"
  pull_request:
    paths:
      - "experiments/prod-progress-cas/**"
      - ".github/workflows/prod-progress-cas-tests.yml"
  workflow_dispatch:

concurrency:
  group: study-os-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate isolated CAS Durable Objects (no cloud requests, no deployment)
        run: node --test experiments/prod-progress-cas/*.test.mjs
