name: Study OS practice keeps its place

on:
  push:
    branches: [main]
    paths: ["acc.html", "eco.html", "math.html", "scripts/study-course-engine.js", "data/courses/**", "tests/practice-keep-position*.cjs", ".github/workflows/practice-position.yml"]
  pull_request:
    paths: ["acc.html", "eco.html", "math.html", "scripts/study-course-engine.js", "data/courses/**", "tests/practice-keep-position*.cjs", ".github/workflows/practice-position.yml"]
  workflow_dispatch:

concurrency:
  group: study-os-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  position:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/practice-keep-position.test.cjs
      - run: npm install --prefix "$RUNNER_TEMP/pp" --no-save --ignore-scripts playwright@1.62.1
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-chromium-${{ runner.os }}
      - run: '"$RUNNER_TEMP/pp/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Browser check
        env:
          NODE_PATH: ${{ runner.temp }}/pp/node_modules
        run: node tests/practice-keep-position-browser.cjs
