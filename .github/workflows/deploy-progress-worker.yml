name: Deploy progress sync Worker (manual)

# Runs only when the owner starts it from the Actions tab and types DEPLOY.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PROGRESS_SYNC_KEY (24+ characters).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to deploy vocabloom-progress-cas-prod'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-progress-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROGRESS_SYNC_KEY: ${{ secrets.PROGRESS_SYNC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check secrets are present (values are never printed)
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test ${#PROGRESS_SYNC_KEY} -ge 24 || { echo "Secret PROGRESS_SYNC_KEY must be at least 24 characters"; exit 1; }
      - name: Offline Worker tests
        run: node --test experiments/prod-progress-cas/*.test.mjs
      - name: Deploy Worker
        working-directory: workers/progress
        run: npx --yes wrangler@4 deploy
      - name: Set sync key secret
        working-directory: workers/progress
        run: printf '%s' "$PROGRESS_SYNC_KEY" | npx --yes wrangler@4 secret put PROGRESS_SYNC_KEY
      - name: Smoke test (read-only GET)
        run: |
          sleep 10
          url=https://vocabloom-progress-cas-prod.kasidit09022550.workers.dev/progress/acc
          code=$(curl -s -o /tmp/body -D /tmp/headers -w '%{http_code}' -H "X-Sync-Key: $PROGRESS_SYNC_KEY" -H 'Origin: https://cheetos9250.github.io' "$url")
          echo "HTTP $code"
          grep -i '^x-sync-revision:' /tmp/headers || { echo "No X-Sync-Revision header"; exit 1; }
          test "$code" = 200
          noauth=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://cheetos9250.github.io' "$url")
          echo "Without key: HTTP $noauth"
          test "$noauth" = 401
