name: Deploy Ask-Gemini Worker (manual)

# Runs only when the owner starts it from the Actions tab and types DEPLOY.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (already set) and two new ones:
#   GEMINI_API_KEY   - the owner's Google AI Studio key (aistudio.google.com/apikey).
#   CLAUDE_MCP_TOKEN - 32+ letters/digits/-/_; goes in the Claude connector URL; change it and redeploy to revoke access.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to deploy study-os-ask-gemini'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-ask-gemini
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLAUDE_MCP_TOKEN: ${{ secrets.CLAUDE_MCP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check secrets are present (values are never printed)
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test ${#GEMINI_API_KEY} -ge 20 || { echo "Secret GEMINI_API_KEY is missing or too short"; exit 1; }
          test ${#CLAUDE_MCP_TOKEN} -ge 32 || { echo "Secret CLAUDE_MCP_TOKEN must be at least 32 characters"; exit 1; }
          printf '%s' "$CLAUDE_MCP_TOKEN" | grep -Eq '^[A-Za-z0-9_-]+$' || { echo "CLAUDE_MCP_TOKEN may use only letters, digits, - and _"; exit 1; }
      - name: Offline tests
        run: node --test tests/ask-gemini-worker.test.cjs
      - name: Deploy Worker
        working-directory: workers/ask-gemini
        run: npx --yes wrangler@4 deploy
      - name: Set secrets
        working-directory: workers/ask-gemini
        run: |
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_API_KEY
          printf '%s' "$CLAUDE_MCP_TOKEN" | npx --yes wrangler@4 secret put CLAUDE_MCP_TOKEN
      - name: Smoke test (one tiny Gemini call)
        run: |
          sleep 10
          base=https://study-os-ask-gemini.kasidit09022550.workers.dev/mcp
          body='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"ask_gemini","arguments":{"prompt":"Reply with the single word OK.","max_output_tokens":64}}}'
          code=$(curl -s -o /tmp/body -w '%{http_code}' -H 'Content-Type: application/json' -H "Authorization: Bearer $CLAUDE_MCP_TOKEN" -d "$body" "$base")
          echo "HTTP $code"; test "$code" = 200
          grep -q '"isError":true' /tmp/body && { echo "Gemini call failed:"; grep -o 'Ask Gemini failed[^"]*' /tmp/body; exit 1; } || true
          grep -q '"result"' /tmp/body || { echo "No result"; exit 1; }
          noauth=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d "$body" "$base")
          echo "Without token: HTTP $noauth"; test "$noauth" = 401
