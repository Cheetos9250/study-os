name: Study OS academic home regression (no deployment)

on:
  push:
    paths:
      - 'index.html'
      - 'course-metadata-draft.html'
      - 'lib/study-os-course-metadata*.js'
      - 'lib/study-os-course-metadata-store.cjs'
      - 'tests/study-os-course-metadata*.test.cjs'
      - 'scripts/study-os-course-metadata-browser.cjs'
      - 'lib/study-os-planner*.js'
      - 'tests/study-os-planner.test.cjs'
      - 'lib/study-os-plan-discovery.cjs'
      - 'lib/study-os-plan-discovery.js'
      - 'tests/study-os-plan-discovery.test.cjs'
      - 'scripts/study-os-planner-browser.cjs'
      - 'scripts/study-os-browser-check.cjs'
      - 'scripts/study-os-source-overlap.cjs'
      - 'tests/study-os-dashboard.test.cjs'
      - 'tests/study-os-source-overlap.test.cjs'
      - 'data/quiz.json'
      - 'lib/study-os-dashboard.js'
      - 'lib/study-os-legacy-progress-reader.js'
      - 'tests/study-os-home.test.cjs'
      - 'tests/study-os-academic-content.test.cjs'
      - 'tests/study-os-content-audit.test.cjs'
      - 'scripts/study-os-content-audit.cjs'
      - 'lib/study-os-learning-analytics.cjs'
      - 'tests/study-os-learning-analytics.test.cjs'
      - 'lib/study-os-legacy-progress-reader.cjs'
      - 'tests/study-os-legacy-progress-reader.test.cjs'
      - 'vocabloom/study-decks.json'
      - 'acc.html'
      - 'eco.html'
      - 'math.html'
      - 'eng.html'
      - 'zh.html'
      - '.github/workflows/study-os-home-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'course-metadata-draft.html'
      - 'lib/study-os-course-metadata*.js'
      - 'lib/study-os-course-metadata-store.cjs'
      - 'tests/study-os-course-metadata*.test.cjs'
      - 'scripts/study-os-course-metadata-browser.cjs'
      - 'lib/study-os-planner*.js'
      - 'tests/study-os-planner.test.cjs'
      - 'lib/study-os-plan-discovery.cjs'
      - 'lib/study-os-plan-discovery.js'
      - 'tests/study-os-plan-discovery.test.cjs'
      - 'scripts/study-os-planner-browser.cjs'
      - 'scripts/study-os-browser-check.cjs'
      - 'scripts/study-os-source-overlap.cjs'
      - 'tests/study-os-dashboard.test.cjs'
      - 'tests/study-os-source-overlap.test.cjs'
      - 'data/quiz.json'
      - 'lib/study-os-dashboard.js'
      - 'lib/study-os-legacy-progress-reader.js'
      - 'tests/study-os-home.test.cjs'
      - 'tests/study-os-academic-content.test.cjs'
      - 'tests/study-os-content-audit.test.cjs'
      - 'scripts/study-os-content-audit.cjs'
      - 'lib/study-os-learning-analytics.cjs'
      - 'tests/study-os-learning-analytics.test.cjs'
      - 'lib/study-os-legacy-progress-reader.cjs'
      - 'tests/study-os-legacy-progress-reader.test.cjs'
      - 'vocabloom/study-decks.json'
      - 'acc.html'
      - 'eco.html'
      - 'math.html'
      - 'eng.html'
      - 'zh.html'
      - '.github/workflows/study-os-home-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static home checks
        run: node --test tests/*.test.cjs

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/study-os-browser" --no-save --ignore-scripts playwright@1.62.1
      - name: Install Chromium and WebKit
        run: '"$RUNNER_TEMP/study-os-browser/node_modules/.bin/playwright" install --with-deps chromium webkit'
      - name: Exercise dashboard and five legacy subjects with synthetic storage
        env:
          NODE_PATH: ${{ runner.temp }}/study-os-browser/node_modules
          STUDY_OS_QA_OUTPUT: ${{ runner.temp }}/study-os-browser-qa
        run: node scripts/study-os-browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-os-browser-qa
          path: ${{ runner.temp }}/study-os-browser-qa
          if-no-files-found: ignore
