name: Study OS academic home regression (no deployment)

on:
  push:
    paths:
      - 'index.html'
      - 'tests/study-os-home.test.cjs'
      - '.github/workflows/study-os-home-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/study-os-home.test.cjs'
      - '.github/workflows/study-os-home-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static home checks
        run: node --test tests/study-os-home.test.cjs
