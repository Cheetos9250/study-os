name: Study OS academic home regression (no deployment)

on:
  push:
    paths:
      - 'index.html'
      - 'tests/study-os-home.test.cjs'
      - 'tests/study-os-academic-content.test.cjs'
      - 'tests/study-os-content-audit.test.cjs'
      - 'scripts/study-os-content-audit.cjs'
      - 'lib/study-os-learning-analytics.cjs'
      - 'tests/study-os-learning-analytics.test.cjs'
      - 'vocabloom/study-decks.json'
      - 'acc.html'
      - 'eco.html'
      - 'math.html'
      - 'eng.html'
      - 'zh.html'
      - '.github/workflows/study-os-home-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/study-os-home.test.cjs'
      - 'tests/study-os-academic-content.test.cjs'
      - 'tests/study-os-content-audit.test.cjs'
      - 'scripts/study-os-content-audit.cjs'
      - 'lib/study-os-learning-analytics.cjs'
      - 'tests/study-os-learning-analytics.test.cjs'
      - 'vocabloom/study-decks.json'
      - 'acc.html'
      - 'eco.html'
      - 'math.html'
      - 'eng.html'
      - 'zh.html'
      - '.github/workflows/study-os-home-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static home checks
        run: node --test tests/study-os-home.test.cjs tests/study-os-academic-content.test.cjs tests/study-os-content-audit.test.cjs tests/study-os-learning-analytics.test.cjs
