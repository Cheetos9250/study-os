name: Study OS local progress backup safety checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/study-nav.js"
      - "scripts/study-progress-restore.js"
      - "acc.html"
      - "scripts/study-course-engine.js"
      - "data/courses/**"
      - "scripts/study-course-mode.js"
      - "assets/study-unify.css"
      - "accounting-textbook.html"
      - "eco.html"
      - "math.html"
      - "eng.html"
      - "zh.html"
      - "assets/study-course-layout.css"
      - "assets/study-course-save.css"
      - "scripts/study-course-storage.js"
      - "tests/study-basic-browser.cjs"
      - "progress-backup.html"
      - "scripts/study-progress-backup.js"
      - "tests/study-progress-backup.test.cjs"
      - ".github/workflows/study-progress-backup-tests.yml"
  pull_request:
    paths:
      - "index.html"
      - "scripts/study-nav.js"
      - "scripts/study-progress-restore.js"
      - "acc.html"
      - "scripts/study-course-engine.js"
      - "data/courses/**"
      - "scripts/study-course-mode.js"
      - "assets/study-unify.css"
      - "accounting-textbook.html"
      - "eco.html"
      - "math.html"
      - "eng.html"
      - "zh.html"
      - "assets/study-course-layout.css"
      - "assets/study-course-save.css"
      - "scripts/study-course-storage.js"
      - "tests/study-basic-browser.cjs"
      - "progress-backup.html"
      - "scripts/study-progress-backup.js"
      - "tests/study-progress-backup.test.cjs"
      - ".github/workflows/study-progress-backup-tests.yml"
  workflow_dispatch:

concurrency:
  group: study-os-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  basic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependency
        run: npm install --prefix "$RUNNER_TEMP/basic-browser" --no-save --ignore-scripts playwright@1.62.1
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.62.1-chromium-webkit-${{ runner.os }}
      - name: Install Chromium and WebKit
        run: '"$RUNNER_TEMP/basic-browser/node_modules/.bin/playwright" install --with-deps chromium webkit'
      - name: Test synthetic study and backup journeys
        env:
          NODE_PATH: ${{ runner.temp }}/basic-browser/node_modules
          QA_OUTPUT: ${{ runner.temp }}/study-basic-qa
        run: node tests/study-basic-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-basic-synthetic-browser-qa
          path: ${{ runner.temp }}/study-basic-qa
