name: Study Sync CAS prototype tests (no deployment)

on:
  push:
    paths:
      - "experiments/study-sync-cas/**"
      - ".github/workflows/study-sync-cas-tests.yml"
  pull_request:
    paths:
      - "experiments/study-sync-cas/**"
      - ".github/workflows/study-sync-cas-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test simulated Durable Object and optimistic concurrency
        run: node --test experiments/study-sync-cas/worker.test.mjs
