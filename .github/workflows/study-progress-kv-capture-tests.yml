name: Study KV backup safety tests (synthetic, no remote access)

on:
  push:
    paths:
      - "scripts/capture-study-progress-kv.mjs"
      - "tests/study-progress-kv-capture.test.mjs"
      - ".github/workflows/study-progress-kv-capture.yml"
      - ".github/workflows/study-progress-kv-capture-tests.yml"
  pull_request:
    paths:
      - "scripts/capture-study-progress-kv.mjs"
      - "tests/study-progress-kv-capture.test.mjs"
      - ".github/workflows/study-progress-kv-capture.yml"
      - ".github/workflows/study-progress-kv-capture-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-kv-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test mock Cloudflare KV capture and absent-key rules
        run: node --test tests/study-progress-kv-capture.test.mjs
      - name: Verify read-only encrypted manual capture gate
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import { readFileSync } from 'node:fs';
            const workflow=readFileSync('.github/workflows/study-progress-kv-capture.yml','utf8');
            const script=readFileSync('scripts/capture-study-progress-kv.mjs','utf8');
            assert.match(workflow,/workflow_dispatch:/);
            assert.match(workflow,/inputs.confirm_readonly == true/);
            assert.match(workflow,/github.ref == 'refs\/heads\/main'/);
            assert.match(workflow,/permissions:\s+contents: read/);
            assert.doesNotMatch(workflow,/^\s+(?:schedule|push|pull_request|pull_request_target):/m);
            assert.doesNotMatch(workflow,/(?:wrangler deploy|git push|d1 execute|kv put)/);
            assert.match(workflow,/gpg --batch --yes --quiet --pinentry-mode loopback --symmetric --cipher-algo AES256 --passphrase-fd 3/);
            assert.match(workflow,/cmp --silent/);
            assert.match(workflow,/retention-days: 7/);
            assert.match(script,/method: 'GET'/);
            assert.doesNotMatch(script,/method: '(?:POST|PUT|PATCH|DELETE)'/);
          "
